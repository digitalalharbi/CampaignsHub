# Serves the built SPA and proxies API calls to the backend service.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # UPLOAD-LIMITS-001 — nginx refuses any request body over 1 MB by default, with a bare HTML 413 the product cannot read. A phone
    # screenshot is routinely 2–6 MB, so every evidence/logo/attachment upload above 1 MB failed here before reaching the API. The
    # application limit is 10 MB (PlatformEvidenceService::MAX_KB); this leaves room for the multipart envelope so the API's own,
    # translated refusal is what people see for a file that really is too large.
    client_max_body_size 16m;

    # PERF-RECOVERY-001 — the bundle went out uncompressed: 4.76 MB on the wire for every first visit,
    # 14 s on Production on 2026-11-01. `gzip_static` serves the files `frontend.production.Dockerfile`
    # compresses at build time; `gzip` covers what has no such file. `gzip_proxied any` because the
    # request arrives through Caddy. Fonts and images are already compressed and are left out.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # EXTERNAL-PAGE-001 — one address on this domain that is NOT the product.
    #
    # `/7kq3md` is a standalone page used as the destination of a paid ad. It borrows the domain and
    # nothing else: no router entry, no React, no product stylesheet, no API call. It is a single
    # self-contained file.
    #
    # Declared ABOVE the history fallback, and as an exact match, for two reasons. The fallback
    # answers every unmatched path with `index.html`, so without this the address would open the
    # product — which is what it must never do. And `=` means it claims this one address and cannot
    # shadow anything else on the domain.
    #
    # `try_files` is an INTERNAL redirect, which is what lets the file live behind the `internal`
    # location below: the page is served, and its real path cannot be opened from outside. The
    # address people are given is the only address that exists.
    #
    # `X-Robots-Tag` because the page is given out, not found. `always` so it survives the 200 as
    # well as any error, and `no-store` because an ad's destination may be replaced at any time and
    # a cached copy is one nobody can change.
    location = /7kq3md {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        try_files /_ext/7kq3md.html =404;
    }

    # The page's own file, reachable ONLY through the rule above. `internal` refuses any request
    # that came from a browser's address bar while allowing nginx's own `try_files` through, so the
    # page has exactly one public address and `/_ext/…` is not it.
    location /_ext/ {
        internal;
    }

    # Owner 2026-10-23 — the legacy /welcome page is retired for good. Every visit is a PERMANENT redirect to the homepage, and the
    # target is the bare `/`: `return 301 /` carries no `$args`, so a `?utm_source=chatgpt.com` (or any query) is not copied into the
    # redirect address. Exact matches, declared above the history fallback.
    #
    # `absolute_redirect off` is not optional. nginx builds an ABSOLUTE Location from what it knows of itself — its own scheme and its own
    # listen port — and behind the TLS proxy that is `http://campaignshub.io:5173/`, an address nobody can open. (Production answered
    # exactly that on the first release of this block.) With it off the header is the relative `/`, which the browser resolves against
    # the address it actually used, on any host, scheme and port.
    location = /welcome {
        absolute_redirect off;
        return 301 /;
    }

    location = /welcome/ {
        absolute_redirect off;
        return 301 /;
    }

    # Hashed bundles never change under their name, so they are cached for a year — and a hashed file that does not exist is a 404, not
    # `index.html` (a script tag handed HTML is a blank page, not an error anyone can read).
    #
    # `add_header` in a location REPLACES the server-level ones, so the security headers are repeated here and in the fallback below.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA history fallback.
    #
    # `index.html` is the file that names the current bundle hashes, so a copy a browser kept after a deploy points at bundles that no
    # longer exist — or, worse, shows last release's page (a footer line that was added and does not appear). `no-cache` is not
    # «don't store»: the browser keeps it and asks the server every time, which answers 304 when nothing changed. It does not touch
    # tracking — the page, its scripts and its `?utm_*` handling are unchanged; only how long a stale copy may be trusted.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SHARE-PREVIEW-IMAGE-REACHABLE-001 — the picture is NOT fetched by the crawler that read the tag.
    #
    # The block below diverts `/r/...` to Laravel only for a crawler user-agent, which is right for
    # the metadata DOCUMENT: a human typing the address wants the report, not an OpenGraph page.
    #
    # It is wrong for the image that document points at. `og:image` is fetched by a separate image
    # fetcher, by every recipient's own client when the message is opened, and by caches in between —
    # and those send ordinary user-agents. On Production they therefore fell through to the SPA
    # fallback and received `index.html`:
    #
    #     GET /r/<token>/preview.png                 → 200 text/html, 6512 bytes
    #     GET /r/<token>/preview.png (WhatsApp UA)    → 404 from Laravel, correctly
    #
    # A card pointing at an HTML document renders as no card at all, so every client link previewed
    # blank in the chat it was pasted into — while the metadata above it was perfectly correct, which
    # is why it survived: the one request nobody makes from inside the product is this one.
    #
    # Matched FIRST and proxied unconditionally. The path is the renderer's own, and Laravel still
    # answers 404 for a token that does not resolve rather than describing a report that may have
    # been revoked.
    #
    # NO BRACE QUANTIFIER. This read `[A-Za-z0-9]{16,64}` to mirror the route's own token shape, and
    # nginx treats `{` and `}` as block delimiters: a location regex containing them must be quoted
    # or the file does not parse. Unquoted, nginx refused to start, the frontend container never came
    # up, and the WHOLE SITE answered 502 — a routing nicety took the product down.
    #
    # `+` carries no braces and needs no quoting, and the length bound was never this file's job: the
    # route constraint in `routes/web.php` already refuses a token of the wrong shape, and the
    # controller refuses one that does not resolve.
    location ~ ^/r/[A-Za-z0-9]+/preview\.png$ {
        proxy_pass http://backend:8000;
    }

    # REPORT-TITLE-METADATA-001 — a crawler asking for a shared report link gets real metadata.
    #
    # A client link is pasted into WhatsApp far more often than it is typed into a browser, and the
    # preview card is the first thing anyone sees of it. Served from here it is `index.html`, so every
    # client link previewed as the product's marketing line — none of WhatsApp, X, LinkedIn, Slack or
    # Telegram runs the React that would have set the real title.
    #
    # ONLY the crawlers are diverted. A human still gets the SPA from the fallback below, so the
    # report itself is unchanged: this cannot break the page, only the card.
    #
    # `proxy_pass` inside `if` is one of the two uses nginx documents as safe (the other is `return`).
    # It is used here rather than a `map` because this file is a server block, and `map` may only be
    # declared at http level.
    location ~ ^/(r|reports/share)/ {
        if ($http_user_agent ~* "(facebookexternalhit|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Applebot|SkypeUriPreview|redditbot|Googlebot)") {
            proxy_pass http://backend:8000;
        }
        try_files $uri $uri/ /index.html;
    }

    # SHORT-LINK-PRODUCTION-001 — `/l/{slug}` is Laravel's, and this file is what decides that.
    #
    # The short link is the whole product at this address: it is read aloud, printed, and pasted into
    # WhatsApp. It has to carry the name customers know rather than the API host, so the hop cannot
    # live where `/api/` does — it has to be routed here, from the domain the link is written on.
    #
    # Without this block `/l/anything` falls through to the SPA history fallback below and React
    # renders «الصفحة غير موجودة» for a link the product had just minted. That is what Production was
    # doing: `GET https://campaignshub.io/l/jm4bf2p` answered 200 with `index.html`.
    #
    # `deploy/nginx-spa.conf` has carried a correct-looking `/l/` block for some time and none of it
    # ever reached a server: no Dockerfile copies that file. `frontend.production.Dockerfile` copies
    # THIS one. A config nothing loads is documentation, and it is why the defect survived being
    # «fixed» — which is also why the block points at `http://backend:8000`, the service name on the
    # compose network the frontend already uses for `/api/` and `/sanctum/`, rather than at a public
    # hostname that nginx would resolve once at start-up and refuse to boot without.
    #
    # Nothing is cached: a cached 302 is a click nobody counts and a destination nobody can change.
    location /l/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AD-MEDIA-RECOVERY-001 — the app's OWN media is Laravel's, exactly like `/api/` and `/l/`.
    #
    # A creative asset this product hosts is stored as a ROOT-RELATIVE path so it survives a port, a
    # host and a deploy (`CreativePresenter::safe()`), and that contract rests on one assumption
    # written in its own docblock: «in production the SPA and the API share an origin». They do not.
    # The SPA is served from campaignshub.io and Laravel from api.campaignshub.io, so `/demo/…` fell
    # through to the history fallback below and the browser was handed `index.html`:
    #
    #   GET https://campaignshub.io/demo/creative-sample.mp4 → 200, text/html, 6512 bytes
    #   GET https://api.campaignshub.io/demo/creative-sample.mp4 → 200, video/mp4, 27649 bytes
    #
    # A player given an HTML document reports a decode or network error and the card sits blank —
    # the owner's «no real preview», and the same shape as SHORT-LINK-PRODUCTION-001 above: a path
    # this origin does not route becomes the React app silently answering for Laravel.
    #
    # Routed rather than rewritten into absolute URLs, so the stored path stays portable.
    location /demo/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sanctum/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Security headers (framework/server details are also hidden at the app layer).
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
