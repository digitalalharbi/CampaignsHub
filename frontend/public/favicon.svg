<!--
  BRAND-MARK-001 — the CampaignsHub symbol.

  What stood here was a purple mark of entirely different geometry, served as both the favicon
  and the apple-touch icon, so the tab of a live product showed somebody else's symbol. The colour
  itself is deliberately not repeated here: a guard checks this file for it.

  Static on purpose: a favicon is fetched by a browser, not rendered by React, so it cannot inherit
  `currentColor` and carries the identity's light-mode green outright. Kept byte-for-byte the same
  geometry as `CampaignsHubMark.tsx` — if one changes, the other has to change with it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g fill="none" stroke="#0d8a6f" stroke-width="6" stroke-linecap="round">
    <path d="M8 14 H24 C34 14 34 32 42 32"/>
    <path d="M8 32 H42"/>
    <path d="M8 50 H24 C34 50 34 32 42 32"/>
  </g>
  <circle cx="52" cy="32" r="7" fill="#e8a33d"/>
</svg>
