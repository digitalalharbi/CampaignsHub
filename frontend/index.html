<!doctype html>
<!--
  MKT-FIX-001 — the document starts in the language and theme the product actually uses.

  This said `lang="en"` with no `dir` and no `data-theme`, while the app resolves to Arabic, RTL and
  dark by default. So the first paint of every FIRST visit was left-to-right and light, and the
  moment `applyDocument()` ran the page flipped: the header swapped sides, the hero re-laid out, and
  the whole document changed colour. On a phone that reads as «it moved and then settled», which is
  exactly what the owner saw.

  It also disagreed with itself: `og:locale` has said `ar_SA` all along, on a document declaring
  English.
-->
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      The stored preference, applied BEFORE the stylesheet paints anything.

      A returning reader who chose English or light must not be shown the defaults first and
      corrected afterwards — that is the same flip in the other direction. This is deliberately a
      blocking inline script and not a module: it has to run before first paint, and the module that
      owns this state cannot, because it arrives with the bundle.

      It is NOT a mask. Nothing is hidden, delayed or faded; the document simply starts in its final
      geometry. `bootDefaults.test.ts` holds these two defaults to the store's own, because
      two places deciding «dark» is how the flash comes back silently.
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement
          var theme = localStorage.getItem('campaign-hub-theme')
          var locale = localStorage.getItem('campaign-hub-locale')
          if (theme !== 'light' && theme !== 'dark') theme = 'dark'
          if (locale !== 'ar' && locale !== 'en') locale = 'ar'
          d.setAttribute('data-theme', theme)
          d.setAttribute('lang', locale)
          d.setAttribute('dir', locale === 'ar' ? 'rtl' : 'ltr')
        } catch (e) {
          /* Private mode can refuse storage. The static defaults above are already correct. */
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كل حملاتك الإعلانية المدفوعة في مكان واحد — CampaignsHub</title>
    <meta
      name="description"
      content="منصة موحدة لإدارة ومتابعة وتحليل الحملات الإعلانية المدفوعة عبر جميع المنصات من مكان واحد."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d8a6f" />
    <!-- PWA / installable (iOS + Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampaignsHub" />
    <!-- iOS does not render an SVG here; it needs a raster tile. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Open Graph -->
    <meta property="og:title" content="كل حملاتك الإعلانية المدفوعة في مكان واحد — CampaignsHub" />
    <meta property="og:description" content="منصة موحدة لإدارة ومتابعة وتحليل الحملات الإعلانية المدفوعة عبر جميع المنصات من مكان واحد." />
    <meta property="og:site_name" content="CampaignsHub" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="كل حملاتك الإعلانية المدفوعة في مكان واحد — CampaignsHub" />
    <meta name="twitter:description" content="منصة موحدة لإدارة ومتابعة وتحليل الحملات الإعلانية المدفوعة عبر جميع المنصات من مكان واحد." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://campaignshub.io" />
    <!--
      BRAND-MARK-001 — the share card, at the 1200×630 the identity file specifies.

      A social crawler cannot render a component, so this is the one place the lockup has to exist as
      an image. It is GENERATED from the same geometry and the same words by
      `frontend/scripts/build-brand-icons.mjs`, which is what keeps it from drifting the way a
      hand-exported logo file would.
    -->
    <meta property="og:image" content="https://campaignshub.io/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://campaignshub.io/og-card.png" />
    <!-- Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CampaignsHub",
        "alternateName": "كل حملاتك الإعلانية المدفوعة في مكان واحد",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Advertising campaign management",
        "operatingSystem": "Web",
        "url": "https://campaignshub.io",
        "inLanguage": ["ar", "en"],
        "description": "One platform to run, monitor and analyse paid advertising across every ad platform.",
        "publisher": {
          "@type": "Organization",
          "name": "CampaignsHub",
          "url": "https://campaignshub.io",
          "logo": "https://campaignshub.io/icon-512.png",
          "email": "info@campaignshub.io"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
