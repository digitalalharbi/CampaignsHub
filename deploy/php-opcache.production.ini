; PERF-BOOTSTRAP-001 — the production image's OPcache, and nothing else's: this file is copied by deploy/backend.production.Dockerfile
; only. The development image (infrastructure/docker/backend.Dockerfile) and CI keep PHP's defaults, so a developer's edit is still seen.
;
; validate_timestamps = 0 — PHP stops stat()-ing every included file on every request. A production container never changes its own
; code: a deploy rebuilds the image and recreates the container (`up -d --build`), so the cache starts empty on every release and a
; stale script cannot outlive one. The cost is real and is named here: code placed in the running container by hand is NOT picked up
; until it restarts, and neither is a compiled Blade view regenerated after its first render — neither happens in this deployment
; (views are not edited at runtime; `bootstrap/cache/*.php` are written once by the deploy's `artisan *:cache` steps, which run in the
; CLI where OPcache is off). To roll back: delete this file or set the value to 1 and recreate the container.
; memory_consumption = 128 — the shared code cache, in MB (PHP's default, written down so it is a decision and not an accident).
; interned_strings_buffer = 16 — MB for interned strings (default 8); a framework this size with ~900 classes of its own fills 8.
; max_accelerated_files = 20000 — script slots (default 10000); app + vendor is of that order, and an over-full cache silently
; stops caching the rest.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
