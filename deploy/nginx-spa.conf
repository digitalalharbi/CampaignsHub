# CampaignsHub — serving the SPA (REVIEW-001)
#
# Every route in this product is a client-side route: `/admin/login`, `/app/dashboard`,
# `/agency/clients/acme`, `/portal/login`. The browser asks the web server for that exact path, and
# a static server that has never heard of it answers 404.
#
# Neither dev nor `vite preview` shows this. Both have a fallback built in, so a deep link works on
# a developer's machine and 404s the first time somebody opens one from an email in production —
# which is precisely the class of failure "it opens on my machine" is worst at catching.
#
# The runbook documented nginx for the API and said nothing about the SPA, so this file exists to be
# the missing half rather than a paragraph somebody has to turn back into configuration.

server {
    listen 443 ssl http2;
    server_name app.campaignshub.example;   # the SPA origin

    root /var/www/campaignshub/frontend/dist;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/…/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/…/privkey.pem;

    # Hashed assets are immutable: the filename changes when the content does, so a long cache is
    # safe and a short one just costs everybody a round trip.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached. It is the file that names the current asset hashes, so a stale
    # copy points a returning visitor at bundles that no longer exist — a blank page after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # THE line this file exists for. A path that is not a real file is a client-side route, so the
    # app is served and React Router resolves it — direct open, refresh, back, a new window, a link
    # pasted into a chat.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.campaignshub.example;   # the API origin

    root /var/www/campaignshub/backend/public;
    index index.php;

    # ssl_certificate     …;
    # ssl_certificate_key …;

    # Laravel's own front controller. No SPA fallback here: an unknown API path is a 404, and
    # answering it with HTML would turn a typo into an unparseable response the client reports as a
    # server error.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # The influencer tracking redirect is a WEB route on the API host, hit by strangers with no
    # session (INFL-003). Nothing special is needed — it is noted so nobody "tidies" /t/ away.
    # location /t/ { … }  → handled by the front controller above.
}

# Sanctum, session cookies and CORS across two origins — the three that break together:
#
#   SANCTUM_STATEFUL_DOMAINS=app.campaignshub.example
#   SESSION_DOMAIN=.campaignshub.example      # a leading dot: shared by both hosts
#   SESSION_SECURE_COOKIE=true
#   SESSION_SAME_SITE=lax
#   CORS_ALLOWED_ORIGINS=https://app.campaignshub.example
#
# `SESSION_DOMAIN` without the leading dot is the classic failure: the XSRF cookie is set on the API
# host, the SPA on the other host never sees it, every unsafe request comes back 419, and the
# customer is told the page expired on a page they just opened.
