; UPLOAD-LIMITS-001 — the largest file the product accepts is 10 MB (PlatformEvidenceService::MAX_KB, report logos, attachments).
; PHP's own defaults are 2 MB per file and 8 MB per request: a 3 MB screenshot was rejected by PHP before Laravel validated it,
; and nginx's default 1 MB body limit rejected it before PHP ever saw it. These values leave headroom above the application limit
; so the application's own message — not the runtime's — is what the person reads.
file_uploads = On
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20
