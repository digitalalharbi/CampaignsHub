name: CI

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # 8.4, not 8.3. The lock file resolves symfony/* v8.1, which requires php >= 8.4.1, so
          # `composer install` could not succeed here and this workflow had never once passed.
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # `ArabicTextLayerTest` drives the real python contract suite behind the PDF text-layer
      # normaliser. Without pikepdf on the runner it marked itself SKIPPED — so the one test that
      # proves an Arabic PDF is searchable rather than merely legible was the one test CI never ran,
      # and a green tick said so anyway. Installing the dependency is the fix; making the test
      # optional would be deleting the coverage while keeping the reassurance.
      - name: Python dependency for the PDF text-layer contract
        run: python3 -m pip install --quiet pikepdf
      - name: Pint (style)
        run: ./vendor/bin/pint --test
      - name: Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: mediabuying_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  # ── The browser gate, on a runner that is only running the gate ────────────────────────────────
  #
  # `npm run gate` verbatim: same script, same Playwright config, same three projects, same
  # `workers: 1`. Nothing about what the gate MEANS changes here — only where it runs.
  #
  # It was run on a developer's laptop, and that is the whole reason for this job. A gate competing
  # with a browser, an editor and Spotlight produced single layout assertions taking fifty-seven
  # minutes and wholesale firefox failures across specs that had passed on chromium minutes earlier
  # — an environment collapsing, reported as a hundred product defects. A verdict that depends on
  # what else the machine happens to be doing is not a verdict.
  gate:
    runs-on: ubuntu-latest
    # A gate that cannot START its tests is not a verdict, and must not look like one.
    #
    # Sized from measurement: chromium 13.5m + firefox 22.5m + webkit 22.5m is ~59 minutes of tests,
    # and observed job durations have run 49–70 minutes. Two hours is real headroom. GitHub's default
    # is SIX, which is how a stalled browser download sat `in_progress` for 2h40m on run 32224855943
    # with backend and frontend long since green and not one test executed.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Backend environment
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate
      # The gate's own servers read these; `e2e/env.ts` overrides the rest per run.
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      # Pure download, no application code. It takes ~2 minutes when GitHub's mirror is healthy; the
      # bound is here so a stall on their side fails in fifteen minutes and says which step did it,
      # instead of holding a runner until the job timeout and reporting nothing at all.
      - name: Browsers
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium firefox webkit
      # The report exporter's Arabic text-layer pass (CAMPAIGNSHUB-PDF-TEXTLAYER) shells out to
      # python3 + pikepdf. It is best-effort and never blocks an export, but leaving it absent here
      # would mean the gate exercises a different code path than a developer's machine does.
      - name: Arabic text-layer toolchain
        run: python3 -m pip install --quiet pikepdf
      - name: Gate — chromium, firefox, webkit
        working-directory: frontend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
        # No `continue-on-error`, no retry wrapper: the script exits with the first non-zero code it
        # saw, and that code is the gate's verdict.
        run: npm run gate
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
