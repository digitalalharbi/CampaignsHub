name: CI

on:
  pull_request:
  # GitHub's own merge queue (a repository-ruleset option) builds each queued PR on this event, with no
  # token of ours involved. Inert until the ruleset enables it; see docs/MERGE_QUEUE.md.
  merge_group:
  # The merge queue (merge-queue.yml) updates a PR's branch with the repository token, and a push made
  # with that token does not start a pull_request run. It starts this one instead, on the branch: the
  # check runs carry the same names on the same commit, so they satisfy the same required checks.
  workflow_dispatch:

# One run per pull request, and a new push cancels the one it supersedes.
#
# Without this, every push left its predecessor running: eleven open PRs were holding nineteen live
# CI runs, three of them for the same branch at three different commits. The gate is a three-browser
# Playwright suite that takes about an hour, so the superseded runs were not merely noise — they held
# the runners, and the runs that mattered sat queued behind answers nobody was waiting for.
#
# Cancelling is safe precisely because a superseded run cannot gate anything: merges are pinned to a
# tested head, so a green result for an older commit is never what lets a PR land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # 8.4, not 8.3. The lock file resolves symfony/* v8.1, which requires php >= 8.4.1, so
          # `composer install` could not succeed here and this workflow had never once passed.
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # `ArabicTextLayerTest` drives the real python contract suite behind the PDF text-layer
      # normaliser. Without pikepdf on the runner it marked itself SKIPPED — so the one test that
      # proves an Arabic PDF is searchable rather than merely legible was the one test CI never ran,
      # and a green tick said so anyway. Installing the dependency is the fix; making the test
      # optional would be deleting the coverage while keeping the reassurance.
      - name: Python dependency for the PDF text-layer contract
        run: python3 -m pip install --quiet pikepdf
      # AUTOPILOT-001 — the agent's cost guard and merge gate, exercised with a stubbed `gh`.
      # Cheap, hermetic, no network: it is here because a workflow that only parses is not a
      # workflow that behaves, and the two claims worth protecting are "an idle hour costs nothing"
      # and "only an exact-head green PR can be merged".
      - name: Autopilot controllers
        # `working-directory: backend` applies to this job, so the path must be absolute from the
        # workspace root — the suite lives at the repository root, not inside the Laravel app.
        working-directory: ${{ github.workspace }}
        run: bash scripts/autopilot/test-autopilot.sh

      - name: Pint (style)
        run: ./vendor/bin/pint --test
      - name: Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: mediabuying_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
  # REPORT-EXPORT-FUNCTIONAL-001 — the image the server actually runs, built before it is deployed.
  #
  # Nothing here ever built `deploy/backend.production.Dockerfile`. The host rebuilds it from `main`
  # on merge, so the FIRST place a broken or incomplete image was exercised was Production — which is
  # how an image with no browser, no Node and no python served a PDF button for months while every
  # check on this workflow stayed green.
  #
  # This job does not deploy and does not push: it proves the Dockerfile still builds, and that the
  # renderer runtime the PDF pipeline needs is present INSIDE the built image. A guard reading the
  # file could be satisfied by a line that looks right; asking the image is what cannot be faked.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production backend image
        run: docker build -f deploy/backend.production.Dockerfile -t campaignshub-backend:ci .

      # Each of these is a dependency the renderer spawns or resolves at runtime. A missing one does
      # not break the build — it breaks the export, silently, on the server.
      - name: The renderer runtime exists in the image
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint sh campaignshub-backend:ci -c "$1"; }
          echo "node:      $(run 'node --version')"
          echo "chromium:   $(run '/usr/bin/chromium --version')"
          echo "python3:   $(run 'python3 --version')"
          run 'python3 -c "import pikepdf; print(\"pikepdf\", pikepdf.__version__)"'
          run 'node -e "require(require(\"module\").createRequire(\"/opt/print/package.json\").resolve(\"playwright-core\"));console.log(\"playwright-core ok\")"'
          # The Arabic face, without which the renderer draws tofu for every heading.
          run 'fc-list 2>/dev/null | grep -qi arabic || ls /usr/share/fonts/noto | grep -qi arabic'
          # The scripts the renderer shells out to must be IN the image, not just in the repo.
          run 'test -f scripts/report-print.mjs && test -f scripts/fix-arabic-textlayer.py'


  # ── The browser gate, on a runner that is only running the gate ────────────────────────────────
  #
  # `npm run gate` verbatim: same script, same Playwright config, same three projects, same
  # `workers: 1`. Nothing about what the gate MEANS changes here — only where, and now in how many
  # jobs, it runs.
  #
  # It was run on a developer's laptop, and that is the whole reason for this job. A gate competing
  # with a browser, an editor and Spotlight produced single layout assertions taking fifty-seven
  # minutes and wholesale firefox failures across specs that had passed on chromium minutes earlier
  # — an environment collapsing, reported as a hundred product defects. A verdict that depends on
  # what else the machine happens to be doing is not a verdict.
  # One JOB per browser, because the gate was already one isolated RUN per browser.
  #
  # `run-gate.mjs` gives chromium, firefox and webkit their own database reset, their own servers and
  # their own Node process — deliberately, so that firefox never meets what chromium created. Nothing
  # is shared between them, which is exactly the property that makes them separable jobs.
  #
  # In one job they ran in sequence: 13.5 + 22.5 + 22.5 ≈ 59 minutes of tests, and 49–70 minutes of
  # wall clock. That hour is the queue's whole throughput — a merge invalidates every other open head,
  # so the drain lands about one pull request per gate. Three jobs cost the same runner-minutes and
  # finish in the time of the slowest browser.
  #
  # Each also installs only the browser it runs. Installing all three took several minutes per job to
  # download two engines it would never open.
  gate:
    runs-on: ubuntu-latest
    strategy:
      # Every browser reports its own verdict. `fail-fast: false` because «webkit failed» and
      # «webkit failed AND firefox failed» are different bugs, and cancelling the others hides the
      # second one until somebody fixes the first.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: gate (${{ matrix.browser }})
    # A gate that cannot START its tests is not a verdict, and must not look like one.
    #
    # Sized from measurement: the slowest single browser is ~22.5 minutes of tests, and the job also
    # installs a browser and boots two servers. Ninety minutes is real headroom for one of them, where
    # two hours was headroom for all three. GitHub's default is SIX, which is how a stalled browser
    # download sat `in_progress` for 2h40m on run 32224855943 with backend and frontend long since
    # green and not one test executed.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Backend environment
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate
      # The gate's own servers read these; `e2e/env.ts` overrides the rest per run.
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      # Pure download, no application code. It takes ~2 minutes when GitHub's mirror is healthy; the
      # bound is here so a stall on their side fails in fifteen minutes and says which step did it,
      # instead of holding a runner until the job timeout and reporting nothing at all.
      # The matrix browser AND chromium.
      #
      # Every project in `playwright.config.ts` declares `dependencies: ['setup']`, and the `setup`
      # project carries no `use` — so it runs under Playwright's default, chromium. The firefox job
      # therefore launches chromium before it launches firefox, and installing only firefox failed
      # six tests with «Executable doesn't exist at …/chromium_headless_shell». Playwright dedupes
      # the repeat when the matrix browser IS chromium.
      #
      # CACHED, and the timeout raised — the webkit leg has lost this step three times.
      #
      # «~2 minutes when GitHub's mirror is healthy» was true and is not the whole distribution.
      # Three runs in this programme died here, each one at exactly fifteen minutes, with the apt
      # half (`--with-deps`) still fetching mesa and gstreamer packages — a job that ran no test and
      # reported «gate failed», which reads as a product defect and is a download.
      #
      # The cache removes the browser payload on a hit (the apt packages are not cached: they are
      # installed into the runner image, not into a directory). The key carries the Playwright
      # version, so an upgrade misses deliberately rather than restoring browsers that no longer
      # match. Twenty-five minutes is the bound for a cold miss — still a bound, so a genuine stall
      # fails and names this step rather than holding the runner.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
      # BROWSER-INSTALL-PREFETCH-001 — system packages come down in parallel, from a cache that survives a failed job.
      #
      # The whole story (the stalled mirror, the dpkg lock a retry used to race, why the install is one hard-failing
      # command and only the browser download retries) is in `.github/scripts/install-browsers.sh`; it is a script so
      # `browser-deps-probe.yml` can exercise the same code on a runner in minutes instead of inside an hour of gate.
      # The archives are cached under a key per run and restored by prefix, so the newest set wins; the save step
      # runs `if: always()` and only when something new was fetched, because the run most in need of the cache is the
      # one that dies partway through the download.
      - name: Restore apt archives
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ matrix.browser }}-${{ github.run_id }}
          restore-keys: |
            apt-debs-${{ runner.os }}-${{ matrix.browser }}-
      - name: Browsers
        id: browsers
        working-directory: frontend
        timeout-minutes: 30
        run: bash ../.github/scripts/install-browsers.sh ${{ matrix.browser }}
      - name: Save apt archives
        if: always() && steps.browsers.outputs.fetched != '' && steps.browsers.outputs.fetched != '0'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ matrix.browser }}-${{ github.run_id }}
      # The report exporter's Arabic text-layer pass (CAMPAIGNSHUB-PDF-TEXTLAYER) shells out to
      # python3 + pikepdf. It is best-effort and never blocks an export, but leaving it absent here
      # would mean the gate exercises a different code path than a developer's machine does.
      - name: Arabic text-layer toolchain
        run: python3 -m pip install --quiet pikepdf
      - name: Gate — ${{ matrix.browser }}
        working-directory: frontend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
          # The default is all three; a job that runs one names it.
          GATE_BROWSERS: ${{ matrix.browser }}
          # GATE-WK-ENGINE-FAULT-001 — the preview server's connection lifecycle (src/build/connectionLog.ts), kept
          # outside test-results/ because Playwright empties that directory when it starts.
          E2E_CONN_LOG: ${{ github.workspace }}/frontend/preview-connections.log
        # No `continue-on-error`, no retry wrapper: the script exits with the first non-zero code it
        # saw, and that code is the gate's verdict.
        run: npm run gate
      # A 500 the gate saw, and could not explain.
      #
      # `expansion-surfaces.spec.ts` failed with «the server responded with a status of 500» on
      # /app/integrations, twice on the same head. That sentence is the entire report: Playwright's
      # artifacts describe the BROWSER's side — a status code and a screenshot of the resulting page
      # — while the exception, its file, its line and its stack were written to the backend's log
      # inside the runner and discarded when the job ended.
      #
      # Tailed inline as well as uploaded, so the next occurrence is readable from the run page
      # instead of behind an artifact download.
      - name: Backend log (why the server answered 500)
        if: failure()
        run: |
          echo "::group::backend/storage/logs — last 200 lines"
          tail -n 200 backend/storage/logs/*.log 2>/dev/null || echo "(no backend log was written)"
          echo "::endgroup::"

      # GATE-WK-ENGINE-FAULT-001 — which connection carried the entry script that never loaded, and who closed it.
      - name: Preview server connections (who closed what)
        if: failure()
        run: |
          echo "::group::preview connections — last 200, server-closed and errors first"
          grep -E "server-timeout|ended=error" frontend/preview-connections.log 2>/dev/null | tail -n 100 || true
          tail -n 200 frontend/preview-connections.log 2>/dev/null || echo "(no connection log was written)"
          echo "::endgroup::"

      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: |
            frontend/preview-connections.log
            frontend/test-results/
            frontend/playwright-report/
            backend/storage/logs/
            # Snapshots written by this run — the only way to obtain a LINUX visual baseline.
            #
            # Baselines are per-platform (`-chromium-linux`, `-chromium-darwin`) and a developer on
            # macOS cannot render the linux one. Playwright writes a missing baseline to the snapshot
            # path and fails that run, so collecting the directory turns an unreproducible file into
            # a downloadable one. Without this the linux baselines could only ever go stale: the
            # homepage pair sat unchanged since #85 and still passed, against an image of a logo the
            # product had replaced.
            frontend/e2e/**/*-snapshots/
          retention-days: 7

  # A branch update made by the merge queue (the repository token) starts no pull_request run, so it
  # starts THIS workflow by dispatch. The pull request ignores the check runs of a dispatched run, so the
  # same verdicts are posted as commit statuses with the names branch protection asks for. They are the
  # real results of this run on this exact commit — nothing is invented, and a failed job posts a failure.
  report-status:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [backend, frontend, image, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post the verdicts for the head commit
        shell: bash
        run: |
          set -u
          post() {
            local context="$1" result="$2" state=failure
            [ "$result" = "success" ] && state=success
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" -f context="$context" \
              -f description="CI run ${GITHUB_RUN_ID}: ${result}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          post "backend" "${{ needs.backend.result }}"
          post "frontend" "${{ needs.frontend.result }}"
          post "image" "${{ needs.image.result }}"
          # One matrix job, three browsers: each browser's context carries the matrix verdict, so a
          # red browser makes all three red rather than hiding which one in an aggregate.
          for b in chromium firefox webkit; do post "gate ($b)" "${{ needs.gate.result }}"; done
