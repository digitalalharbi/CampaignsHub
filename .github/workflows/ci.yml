name: CI

on:
  pull_request:
    # `labeled`: the Lander adds `full-gate` to the PR it is about to land, which starts the full three-browser run.
    types: [opened, synchronize, reopened, labeled]
  # GitHub's own merge queue (a repository-ruleset option) builds each queued PR on this event, with no
  # token of ours involved. Inert until the ruleset enables it; see docs/MERGE_QUEUE.md.
  merge_group:
  # The merge queue (merge-queue.yml) updates a PR's branch with the repository token, and a push made
  # with that token does not start a pull_request run. It starts this one instead, on the branch: the
  # check runs carry the same names on the same commit, so they satisfy the same required checks.
  workflow_dispatch:

# One run per pull request, and a new push cancels the one it supersedes.
#
# Without this, every push left its predecessor running: eleven open PRs were holding nineteen live
# CI runs, three of them for the same branch at three different commits. The gate is a three-browser
# Playwright suite that takes about an hour, so the superseded runs were not merely noise — they held
# the runners, and the runs that mattered sat queued behind answers nobody was waiting for.
#
# Cancelling is safe precisely because a superseded run cannot gate anything: merges are pinned to a
# tested head, so a green result for an older commit is never what lets a PR land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # CI-TIER-001: the longest jobs are defined first so the runner queue starts them first (webkit ~19 min, firefox ~17).
  gate-webkit-shards:
    name: gate shards (webkit)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gate') }}
    uses: ./.github/workflows/gate-shards.yml
    with:
      browser: webkit
      shards: '[1,2,3,4,5]'
      total: 5
      weights: '215:224:278:206:195'

  gate-firefox-shards:
    name: gate shards (firefox)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gate') }}
    uses: ./.github/workflows/gate-shards.yml
    with:
      browser: firefox
      shards: '[1,2,3,4,5]'
      total: 5
      weights: '236:257:285:166:189'
  # CI-TIER-001 — the cheap run for every PR, the full three-browser gate for the PR that is about to land.
  #
  # Every open PR used to start all 24 jobs; GitHub's free plan runs 20 at once, so a run sat queued 35-45 minutes
  # behind other PRs' runs (measured 2026-11-13: shards started +35..+45 min after the run did, then ran 16 minutes).
  # A PR now runs backend + frontend + image + chromium. Firefox and WebKit run for a dispatch, a merge_group, or a PR
  # labelled `full-gate` — which the Lander does to the one PR it is landing (`ch-scripts/fullgate.sh`, from
  # `refresh.sh`). Otherwise they are SKIPPED, never green, and `waitpr.sh` / `merge-queue.yml` require `gate (firefox)`
  # and `gate (webkit)` to be SUCCESS, so nothing lands without all three browsers.
  #
  # CI-TIER-002 — shard counts: backend 5, firefox 5, webkit 5 (was 4 each), so the slowest shard (webkit 19.4 min
  # measured on #1054) drops to about 15; firefox and webkit weights are the measured 4-way weights re-cut at equal
  # time. CI-TIER-003: re-cut once more from the measured shard times of #1055 (webkit 15.5/20.9/13.8/17.5/14.8, firefox
  # 10.6/14.6/10.6/17.9/12.0 minutes), damped by 0.6 for the fixed per-shard setup. The long jobs are defined first and carry no `needs`, so the runner queue starts them at t=0.
  # CI-SPEED-001 — the backend check, as three kinds of job behind ONE name.
  #
  # `backend` used to be one job: autopilot + pint + larastan, then `php artisan test` over ~8,000 tests in one process
  # — 35 to 67 minutes, the longest job of the run. The suite is now dealt into four shards by
  # `.github/scripts/backend-shard.py`, from PHPUnit's OWN list of the suite (`--list-test-files`, `--list-tests`
  # against the repository's `phpunit.xml`), each on its own runner with its own postgres and redis — the isolation
  # every shard needs, because RefreshDatabase migrates the database a shard owns.
  #
  # `artisan test --parallel` is NOT used: there is no paratest here, and it prints nothing and exits 0.
  #
  # The job named `backend` — the required check, and the name the Lander and the merge queue read — runs last and is
  # green ONLY when the static job and every shard SUCCEEDED (cancelled, skipped or failed are all red) AND the
  # shards' evidence proves the whole suite ran exactly once: same full list in every shard, disjoint shards whose
  # union is that list, and each shard's junit recording every test it was given (see the script's docstring).
  backend-static:
    name: backend (static)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # 8.4, not 8.3. The lock file resolves symfony/* v8.1, which requires php >= 8.4.1, so
          # `composer install` could not succeed here and this workflow had never once passed.
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # AUTOPILOT-001 — the agent's cost guard and merge gate, exercised with a stubbed `gh`.
      # Cheap, hermetic, no network: it is here because a workflow that only parses is not a
      # workflow that behaves, and the two claims worth protecting are "an idle hour costs nothing"
      # and "only an exact-head green PR can be merged".
      - name: Autopilot controllers
        # `working-directory: backend` applies to this job, so the path must be absolute from the
        # workspace root — the suite lives at the repository root, not inside the Laravel app.
        working-directory: ${{ github.workspace }}
        run: bash scripts/autopilot/test-autopilot.sh
      - name: Pint (style)
        run: ./vendor/bin/pint --test
      - name: Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  backend-tests:
    name: backend (tests ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: «shard 2 failed» and «shards 2 and 3 failed» are different findings.
      fail-fast: false
      matrix:
        # The shard count is written twice — here and as the `5` in the plan/verdict calls below. Change all of them.
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # `ArabicTextLayerTest` drives the real python contract suite behind the PDF text-layer
      # normaliser. Without pikepdf on the runner it marked itself SKIPPED — so the one test that
      # proves an Arabic PDF is searchable rather than merely legible was the one test CI never ran,
      # and a green tick said so anyway. Installing the dependency is the fix; making the test
      # optional would be deleting the coverage while keeping the reassurance.
      - name: Python dependency for the PDF text-layer contract
        run: python3 -m pip install --quiet pikepdf
      # Writes this shard's phpunit.xml (the repository's, with only <testsuites> narrowed to this shard's files) and
      # the evidence the `backend` verdict reads. Fails if PHPUnit lists nothing.
      - name: Plan shard ${{ matrix.shard }}/5
        run: python3 ../.github/scripts/backend-shard.py plan ${{ matrix.shard }} 5 "$RUNNER_TEMP/backend-evidence"
      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: mediabuying_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
        # The same command as before. `--log-junit` only records what ran, for the verdict.
        run: php artisan test --log-junit="$RUNNER_TEMP/backend-evidence/junit.xml"
      - name: Shard evidence for the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}
          # A rerun of failed jobs re-uploads under the same name; without this, upload-artifact@v4 answers 409.
          overwrite: true
          path: ${{ runner.temp }}/backend-evidence/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    # `always()`, not `!cancelled()`: a job that is skipped reports «skipped», and a skipped required check counts
    # as passing. This one always runs and is red unless every part it stands for succeeded.
    if: ${{ always() }}
    needs: [backend-static, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every backend job succeeded
        run: |
          echo "backend (static): ${{ needs.backend-static.result }}"
          echo "backend (tests):  ${{ needs.backend-tests.result }}"
          [ "${{ needs.backend-static.result }}" = success ] && [ "${{ needs.backend-tests.result }}" = success ] \
            || { echo "::error::a backend job did not succeed (failure, cancelled and skipped are all red)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: ${{ runner.temp }}/backend-evidence
      - name: The shards ran the whole suite, exactly once
        run: python3 .github/scripts/backend-shard.py verdict 5 "$RUNNER_TEMP/backend-evidence"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
  # REPORT-EXPORT-FUNCTIONAL-001 — the image the server actually runs, built before it is deployed.
  #
  # Nothing here ever built `deploy/backend.production.Dockerfile`. The host rebuilds it from `main`
  # on merge, so the FIRST place a broken or incomplete image was exercised was Production — which is
  # how an image with no browser, no Node and no python served a PDF button for months while every
  # check on this workflow stayed green.
  #
  # This job does not deploy and does not push: it proves the Dockerfile still builds, and that the
  # renderer runtime the PDF pipeline needs is present INSIDE the built image. A guard reading the
  # file could be satisfied by a line that looks right; asking the image is what cannot be faked.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production backend image
        run: docker build -f deploy/backend.production.Dockerfile -t campaignshub-backend:ci .

      # Each of these is a dependency the renderer spawns or resolves at runtime. A missing one does
      # not break the build — it breaks the export, silently, on the server.
      - name: The renderer runtime exists in the image
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint sh campaignshub-backend:ci -c "$1"; }
          echo "node:      $(run 'node --version')"
          echo "chromium:   $(run '/usr/bin/chromium --version')"
          echo "python3:   $(run 'python3 --version')"
          run 'python3 -c "import pikepdf; print(\"pikepdf\", pikepdf.__version__)"'
          run 'node -e "require(require(\"module\").createRequire(\"/opt/print/package.json\").resolve(\"playwright-core\"));console.log(\"playwright-core ok\")"'
          # The Arabic face, without which the renderer draws tofu for every heading.
          run 'fc-list 2>/dev/null | grep -qi arabic || ls /usr/share/fonts/noto | grep -qi arabic'
          # The scripts the renderer shells out to must be IN the image, not just in the repo.
          run 'test -f scripts/report-print.mjs && test -f scripts/fix-arabic-textlayer.py'

      # CREATIVE-VIDEO-FRAME-COVER-001 — the cover fallback spawns ffmpeg (and busybox `nice`). Ask the image,
      # then take a real frame from a generated clip, over the same argument shape the extractor uses.
      - name: ffmpeg exists in the image and can take a frame
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint sh campaignshub-backend:ci -c "$1"; }
          echo "ffmpeg: $(run 'ffmpeg -version | head -1')"
          run 'nice -n 10 ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=duration=1:size=320x240:rate=10 -ss 0.5 -frames:v 1 -vf "scale=min(640\,iw):-2" -q:v 4 -f image2pipe -c:v mjpeg pipe:1 | head -c 3 | od -An -tx1 | grep -q "ff d8 ff"'


  # ── The browser gate, on a runner that is only running the gate ────────────────────────────────
  #
  # `npm run gate` verbatim: same script, same Playwright config, same three projects, same
  # `workers: 1`. Nothing about what the gate MEANS changes here — only where, and now in how many
  # jobs, it runs.
  #
  # It was run on a developer's laptop, and that is the whole reason for this job. A gate competing
  # with a browser, an editor and Spotlight produced single layout assertions taking fifty-seven
  # minutes and wholesale firefox failures across specs that had passed on chromium minutes earlier
  # — an environment collapsing, reported as a hundred product defects. A verdict that depends on
  # what else the machine happens to be doing is not a verdict.
  # One JOB per browser, because the gate was already one isolated RUN per browser.
  #
  # `run-gate.mjs` gives chromium, firefox and webkit their own database reset, their own servers and
  # their own Node process — deliberately, so that firefox never meets what chromium created. Nothing
  # is shared between them, which is exactly the property that makes them separable jobs.
  #
  # In one job they ran in sequence: 13.5 + 22.5 + 22.5 ≈ 59 minutes of tests, and 49–70 minutes of
  # wall clock. That hour is the queue's whole throughput — a merge invalidates every other open head,
  # so the drain lands about one pull request per gate. Three jobs cost the same runner-minutes and
  # finish in the time of the slowest browser.
  #
  # Each also installs only the browser it runs. Installing all three took several minutes per job to
  # download two engines it would never open.
  #
  # CI-SPEED-001 — and now each browser in FOUR shard jobs, behind the same check name.
  #
  # One job per browser still took 41–77 minutes, and the slowest browser was the whole run's wall clock. Each browser
  # is now `gate-shards.yml` called with four shards: every shard is the old per-browser job (own runner, own
  # database reset and seed, own servers, `npm run gate` verbatim) running a contiguous quarter of that browser's
  # files via Playwright's `--shard`. The `setup` project runs in every shard, as it ran in every job.
  #
  # The job named `gate (<browser>)` — the name the Lander, `waitpr.sh` and the merge queue read — is no longer the
  # one that runs tests. It runs after its four shards and is green ONLY when (1) the shard call SUCCEEDED (failure,
  # cancelled and skipped are all red — it uses `always()`, so it is never itself skipped into a pass), and (2)
  # `gate-verdict.py` proves from the shards' own reports that the union of what they ran is EXACTLY the suite
  # Playwright lists for that browser, each test once, none failed.
  #
  # The weights move the boundaries between the contiguous slices so each takes ~equal MINUTES rather than equal
  # test counts (one file holds 224 quick tests). They were computed from the per-test timestamps of run 43054580907
  # (min-max contiguous partition over whole files). They cannot change coverage: Playwright's shard filter is a
  # partition whatever the weights say, and the verdict checks it on every run.
  gate-chromium-shards:
    name: gate shards (chromium)
    uses: ./.github/workflows/gate-shards.yml
    with:
      browser: chromium
      shards: '[1,2,3,4]'
      total: 4
      weights: '262:347:281:226'
  gate-chromium:
    name: gate (chromium)
    if: ${{ always() }}
    needs: gate-chromium-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every chromium shard succeeded
        run: |
          echo "shards: ${{ needs.gate-chromium-shards.result }}"
          [ "${{ needs.gate-chromium-shards.result }}" = success ] \
            || { echo "::error::a chromium shard did not succeed (failure, cancelled and skipped are all red)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-shard-chromium-*
          path: ${{ runner.temp }}/gate-evidence
      - name: The shards ran the whole chromium suite, exactly once
        run: python3 .github/scripts/gate-verdict.py chromium 4 "$RUNNER_TEMP/gate-evidence"
      - name: Merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-merged-chromium
          # A rerun of failed jobs re-uploads under the same name; without this, upload-artifact@v4 answers 409.
          overwrite: true
          path: ${{ runner.temp }}/gate-evidence/merged.json
          if-no-files-found: ignore
          retention-days: 7

  gate-firefox:
    name: gate (firefox)
    if: ${{ always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gate')) }}
    needs: gate-firefox-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every firefox shard succeeded
        run: |
          echo "shards: ${{ needs.gate-firefox-shards.result }}"
          [ "${{ needs.gate-firefox-shards.result }}" = success ] \
            || { echo "::error::a firefox shard did not succeed (failure, cancelled and skipped are all red)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-shard-firefox-*
          path: ${{ runner.temp }}/gate-evidence
      - name: The shards ran the whole firefox suite, exactly once
        run: python3 .github/scripts/gate-verdict.py firefox 5 "$RUNNER_TEMP/gate-evidence"
      - name: Merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-merged-firefox
          # A rerun of failed jobs re-uploads under the same name; without this, upload-artifact@v4 answers 409.
          overwrite: true
          path: ${{ runner.temp }}/gate-evidence/merged.json
          if-no-files-found: ignore
          retention-days: 7

  gate-webkit:
    name: gate (webkit)
    if: ${{ always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gate')) }}
    needs: gate-webkit-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every webkit shard succeeded
        run: |
          echo "shards: ${{ needs.gate-webkit-shards.result }}"
          [ "${{ needs.gate-webkit-shards.result }}" = success ] \
            || { echo "::error::a webkit shard did not succeed (failure, cancelled and skipped are all red)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-shard-webkit-*
          path: ${{ runner.temp }}/gate-evidence
      - name: The shards ran the whole webkit suite, exactly once
        run: python3 .github/scripts/gate-verdict.py webkit 5 "$RUNNER_TEMP/gate-evidence"
      - name: Merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-merged-webkit
          # A rerun of failed jobs re-uploads under the same name; without this, upload-artifact@v4 answers 409.
          overwrite: true
          path: ${{ runner.temp }}/gate-evidence/merged.json
          if-no-files-found: ignore
          retention-days: 7

  # A branch update made by the merge queue (the repository token) starts no pull_request run, so it
  # starts THIS workflow by dispatch. The pull request ignores the check runs of a dispatched run, so the
  # same verdicts are posted as commit statuses with the names branch protection asks for. They are the
  # real results of this run on this exact commit — nothing is invented, and a failed job posts a failure.
  report-status:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [backend, frontend, image, gate-chromium, gate-firefox, gate-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post the verdicts for the head commit
        shell: bash
        run: |
          set -u
          post() {
            local context="$1" result="$2" state=failure
            [ "$result" = "success" ] && state=success
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" -f context="$context" \
              -f description="CI run ${GITHUB_RUN_ID}: ${result}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          post "backend" "${{ needs.backend.result }}"
          post "frontend" "${{ needs.frontend.result }}"
          post "image" "${{ needs.image.result }}"
          # One verdict job per browser now, so each browser's context carries its OWN verdict.
          post "gate (chromium)" "${{ needs.gate-chromium.result }}"
          post "gate (firefox)" "${{ needs.gate-firefox.result }}"
          post "gate (webkit)" "${{ needs.gate-webkit.result }}"
