name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-MAP $(date -u +%FT%TZ)"
            for t in registration_requests contact_messages support_tickets data_requests external_requests leads lead_form_submissions influencers influencer_nominations influencer_collaborations workspace_invitations tenant_addons integration_webhook_events report_shares tenants subscriptions subscription_plans client_notifications; do
              cols=$(q "select string_agg(column_name,',' order by ordinal_position) from information_schema.columns where table_schema='public' and table_name='$t';" | grep -v -E '^(BEGIN|ROLLBACK)$')
              echo "## TABLE $t"
              echo "cols: $cols"
              q "select 'total',count(*),min(created_at)::date,max(created_at)::date from $t;" | grep -v -E '^(BEGIN|ROLLBACK)$'
              sc=""
              for c in state status; do case ",$cols," in *",$c,"*) [ -z "$sc" ] && sc=$c;; esac; done
              if [ -n "$sc" ]; then
                echo "-- by $sc (count, oldest, newest)"
                q "select $sc,count(*),min(created_at)::date,max(created_at)::date from $t group by 1 order by 2 desc;" | grep -v -E '^(BEGIN|ROLLBACK)$'
                for a in assigned_to assigned_user_id assignee_id owner_id reviewed_by reviewer_id; do
                  case ",$cols," in *",$a,"*) echo "-- by $sc: rows with $a null"; q "select $sc,count(*) filter (where $a is null),count(*) from $t group by 1 order by 3 desc;" | grep -v -E '^(BEGIN|ROLLBACK)$';; esac
                done
              fi
              echo "-- weekly last 8w"
              q "select date_trunc('week',created_at)::date,count(*) from $t where created_at > now()-interval '8 weeks' group by 1 order by 1;" | grep -v -E '^(BEGIN|ROLLBACK)$'
            done
            echo "## external_requests by request status key"
            q "select rs.key,count(*),min(er.created_at)::date,max(er.created_at)::date,count(*) filter (where er.assigned_to is null),count(distinct er.tenant_id) from external_requests er join request_statuses rs on rs.id=er.status_id group by 1 order by 2 desc;"
            echo "## external_requests by type"
            q "select rt.key,count(*) from external_requests er join request_types rt on rt.id=er.type_id group by 1 order by 2 desc;"
            echo "## external_requests is_demo / client linked / sla"
            q "select is_demo,count(*),count(*) filter (where client_id is not null),count(*) filter (where sla_due_at is not null and sla_due_at<now()) from external_requests group by 1;"
            echo "## portal tenants"
            q "select count(*) filter (where portal_enabled),count(*) filter (where is_default_portal),count(*) filter (where portal_domain is not null),count(*) from tenants;"
            echo "## subscriptions by plan and status"
            q "select p.code,s.status,count(*) from subscriptions s join subscription_plans p on p.id=s.plan_id group by 1,2 order by 1,2;"
            echo "## plans"
            q "select code,is_active,count(*) from subscription_plans group by 1,2 order by 1;"
            echo "## registrations by plan_code and state"
            q "select plan_code,state,count(*),count(*) filter (where tenant_id is not null) from registration_requests group by 1,2 order by 1,2;"
            echo "## registrations by account_type/requested_portal"
            q "select account_type,requested_portal,count(*) from registration_requests group by 1,2 order by 3 desc;"
            echo "## registration decisions"
            q "select * from (select 'decisions' k,count(*) from registration_decisions) x;"
            echo "## leads by provider/source/status"
            q "select provider,source,status,count(*),count(*) filter (where assigned_to is null) from leads group by 1,2,3 order by 4 desc limit 30;"
            echo "## webhook events by provider/status"
            q "select provider,status,count(*),max(created_at)::date from integration_webhook_events group by 1,2 order by 3 desc limit 30;"
            echo "## mail_deliveries by kind/status (8w)"
            q "select kind,status,count(*) from mail_deliveries where created_at>now()-interval '8 weeks' group by 1,2 order by 3 desc limit 60;"
            echo "## laravel notifications by type"
            q "select type,count(*),count(*) filter (where read_at is null) from notifications group by 1 order by 2 desc limit 30;"
            echo "== END FACTS-MAP"
            exit 0
