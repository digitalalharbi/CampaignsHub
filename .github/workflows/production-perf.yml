name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-COVER2 $(date -u +%FT%TZ)"
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off' <<'SQL'
            BEGIN READ ONLY;
            select provider, coalesce(substring(video_url from '^https://([^/]+)/'),'-') host, (cover_error is not null) failed_marked, cover_attempts, count(*) n,
              min(cover_next_attempt_at) min_next, max(cover_next_attempt_at) max_next
            from external_creatives where is_demo=false and cover_path is null and video_url like 'https://%' and provider in ('snapchat','tiktok','meta')
            group by 1,2,3,4 order by 1,5 desc;
            select provider, cover_attempts, count(*) n, min(cover_next_attempt_at) min_next, max(cover_next_attempt_at) max_next
            from external_creatives where is_demo=false and cover_path is null and cover_next_attempt_at > now() group by 1,2 order by 1,2;
            select count(*) filter (where payload like '%CacheCreativeCover%') cover_jobs_failed_total, max(failed_at) filter (where payload like '%CacheCreativeCover%') newest_cover_fail, count(*) filter (where failed_at > now() - interval '24 hours') failed_24h from failed_jobs;
            ROLLBACK;
            SQL
            $DC exec -T backend sh -c 'cd storage/app; find . -path "*media/covers*" -type f -mmin -90 | wc -l; find . -path "*media/covers*" -type f | wc -l; ls'
            echo "== END FACTS-COVER2"
            exit 0
