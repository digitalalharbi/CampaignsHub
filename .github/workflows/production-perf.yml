name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-MAIL $(date -u +%FT%TZ)"
            echo "## M1. digest_sends for the no_results events closed since deploy: kind | status | count"
            q "select kind,status,count(*) from digest_sends where alert_event_id in (select id::text from alert_events where type='no_results' and resolved_at>'2026-11-12 12:59:20+00') and created_at>'2026-11-12 12:59:20+00' group by 1,2;"
            echo "## M1b. total digest_sends since deploy for those events"
            q "select count(*) from digest_sends where alert_event_id in (select id::text from alert_events where type='no_results' and resolved_at>'2026-11-12 12:59:20+00') and created_at>'2026-11-12 12:59:20+00';"
            echo "## M2. app_notifications since deploy titled Recovered (any rule): count"
            q "select count(*) from app_notifications where created_at>'2026-11-12 12:59:20+00' and (title like 'Recovered:%' or title_ar like 'تعافى:%');"
            echo "## M2b. Recovered notifications since deploy by source rule type: type | count"
            q "select type,count(*) from app_notifications where created_at>'2026-11-12 12:59:20+00' and (title like 'Recovered:%' or title_ar like 'تعافى:%') group by 1 order by 1;"
            echo "## M2c. Recovered alert_events since deploy by rule type: type | count"
            q "select type,count(*) from alert_events where resolved_at>'2026-11-12 12:59:20+00' and context ? 'recovered_at' group by 1 order by 1;"
            echo "## M3. app_notifications since deploy on the closed events' campaigns: count"
            q "select count(*) from app_notifications where created_at>'2026-11-12 12:59:20+00' and entity_id in (select entity_id from alert_events where id in (select id from alert_events where type='no_results' and resolved_at>'2026-11-12 12:59:20+00'));"
            echo "## M4. mail_deliveries since deploy by kind: kind | count"
            q "select kind,count(*) from mail_deliveries where created_at>'2026-11-12 12:59:20+00' group by 1 order by 1;"
            echo "== END FACTS-MAIL"
            exit 0
