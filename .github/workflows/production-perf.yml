name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-BARDISI $(date -u +%FT%TZ)"
            echo "## P. projects matching: id8 | status | client tz"
            q "select left(p.id::text,8),p.status,coalesce((select cw.timezone from client_workspaces cw where cw.id=p.client_workspace_id),'-') from projects p where p.name ilike '%برديسي%';"
            echo "## A. campaigns: id8 | status | objective | source | platform_value | ends_on | providers:objective"
            q "select left(uc.id::text,8),uc.status,coalesce(uc.objective,'-'),coalesce(uc.objective_source,'-'),coalesce(uc.objective_platform_value,'-'),coalesce(uc.ends_on::text,'-'),(select string_agg(distinct ec.provider||':'||coalesce(ec.objective,'-'),',') from external_campaigns ec where ec.unified_campaign_id=uc.id) from unified_campaigns uc where uc.deleted_at is null and uc.project_id in (select id from projects where name ilike '%برديسي%') order by uc.status, uc.created_at desc;"
            echo "## B. last 7d by campaign: id8 | provider | metric_key | sum | rows"
            q "select left(dm.unified_campaign_id::text,8),dm.provider,dm.metric_key,round(sum(coalesce(dm.value,dm.original_amount))::numeric,2),count(*) from daily_metrics dm where dm.project_id in (select id from projects where name ilike '%برديسي%') and dm.metric_date>=current_date-7 and coalesce(dm.is_demo,false)=false group by 1,2,3 order by 1,2,3;"
            echo "## C. no_results alert events: event id8 | campaign id8 | status | last_triggered | ctx conversions | ctx spend | ctx result_key"
            q "select left(ae.id::text,8),left(ae.entity_id,8),ae.status,ae.last_triggered_at,ae.context->>'conversions',ae.context->>'spend',coalesce(ae.context->>'result_key','-') from alert_events ae where ae.type='no_results' and ae.project_id in (select id from projects where name ilike '%برديسي%') order by ae.last_triggered_at desc limit 20;"
            echo "## D. open no_results events platform-wide: count"
            q "select count(*) from alert_events where type='no_results' and status in ('open','snoozed');"
            echo "== END FACTS-BARDISI"
            exit 0
