name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-LIVELINK $(date -u +%FT%TZ)"
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At' <<'SQL'
            BEGIN READ ONLY;
            \echo -- google entity rows by type and day
            select entity_type, metric_date, count(*), sum(spend), sum(spend_original), count(*) filter (where spend is null) as spend_null, max(original_currency) from entity_daily_metrics where project_id='c073e9c6-c70a-4276-87da-85338530b137' and provider='google' group by 1,2 order by 2,1;
            \echo -- google daily_metrics spend by day
            select metric_date, count(*), sum(value) filter (where metric_key='spend'), sum(original_amount) filter (where metric_key='spend'), count(*) filter (where metric_key='spend' and value is null) as spend_null from daily_metrics where project_id='c073e9c6-c70a-4276-87da-85338530b137' and provider='google' group by 1 order by 1;
            \echo -- eur rates
            select base_currency, quote_currency, rate, rate_date, source from currency_rates where base_currency='EUR' or quote_currency='EUR' order by rate_date;
            \echo -- openai_ads rows
            select 'daily_metrics', count(*), min(metric_date), max(metric_date) from daily_metrics where project_id='c073e9c6-c70a-4276-87da-85338530b137' and provider='openai_ads';
            select 'entity_daily_metrics', count(*), min(metric_date), max(metric_date) from entity_daily_metrics where project_id='c073e9c6-c70a-4276-87da-85338530b137' and provider='openai_ads';
            \echo -- now
            select now();
            ROLLBACK;
            SQL
            echo "== END FACTS-LIVELINK"
            exit 0
