name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Mode: read (read-only checks and dry runs)'
        required: false
        default: 'read'
      reconcile_account:
        description: 'Live project id (for the read-only snapshot)'
        required: false
        default: ''
      reconcile_from:
        description: 'Archived project id (for the read-only read check)'
        required: false
        default: ''
      reconcile_to:
        description: 'unused'
        required: false
        default: ''
      tokens:
        description: 'unused'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            art() { $DC exec -T backend php artisan "$@" 2>&1 | sed -E 's/([0-9a-fA-F]{8})-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/\1-***/g'; }
            # RELEASE-VERIFY-001 (Owner-approved 2026-11-15/16). READ-ONLY: dry runs and counts only. No names, no emails, no tokens printed.
            # Ids arrive as inputs, are validated as UUIDs and never echoed.
            UUID='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
            LIVE="${RACCOUNT}"; ARCH="${RFROM}"
            echo "== RELEASE-VERIFY $(date -u +%FT%TZ) mode=${HOURS}"
            if [ "${HOURS}" = "apply-core" ]; then
              # APPLY-CORE: the Owner-approved post-deploy steps. Each is reversible or additive; none deletes. Ids masked in the output.
              echo "## A1. close false data-arrival alerts (--apply; reversible with --undo)"
              art alerts:reevaluate-data-arrival --apply
              echo "## A2. archive effects for every archived project (--apply; never deletes)"
              art lifecycle:apply-archive-effects --all-archived --apply
              echo "## A3. key the report schedules (additive)"
              art reports:dedupe-schedules
              echo "## A4. name existing notifications by kind (additive)"
              art notifications:backfill-kind
              echo "## A5. legacy external recipients -> pending confirmation (nothing sent, nothing deleted)"
              art notifications:v2-import-legacy
              if [[ "$LIVE" =~ $UUID ]]; then
                echo "## A6. live project snapshot AFTER (counts)"
                art lifecycle:snapshot --project="$LIVE"
              fi
              if [[ "$ARCH" =~ $UUID ]]; then
                echo "## A7. archived project snapshot AFTER (counts)"
                art lifecycle:snapshot --project="$ARCH"
              fi
              echo "== done"; exit 0
            fi
            [ "${HOURS}" = "read" ] || { echo "modes: read | apply-core"; exit 0; }
            echo "## 0. migrations pending (must be 0)"
            art migrate:status --pending 2>&1 | grep -ciE "pending" 
            echo "## 1. mail DNS (SPF/DKIM/DMARC report; changes nothing)"
            art mail:dns-check
            echo "## 2. currency: conversion report Oct+Nov (anonymous indexes)"
            art fx:conversion-report
            echo "## 3. currency audit (masked)"
            art money:currency-audit --sample=3
            echo "## 4. duplicate report schedules (dry run)"
            art reports:dedupe-schedules --dry-run
            echo "## 5. false data-arrival alerts (dry run)"
            art alerts:reevaluate-data-arrival --dry-run
            echo "## 6. archive effects for every archived project (dry run)"
            art lifecycle:apply-archive-effects --all-archived --dry-run
            echo "## 7. notification kind backfill (dry run)"
            art notifications:backfill-kind --dry-run
            echo "## 8. legacy external recipients import (dry run)"
            art notifications:v2-import-legacy --dry-run
            echo "## 9. spend limits -> budgets (count only, no --apply)"
            art funding:convert-spend-limits
            if [[ "$LIVE" =~ $UUID ]]; then
              echo "## 10. live project snapshot (counts)"
              art lifecycle:snapshot --project="$LIVE"
            fi
            if [[ "$ARCH" =~ $UUID ]]; then
              echo "## 11. archived project snapshot (counts)"
              art lifecycle:snapshot --project="$ARCH"
              if [[ "$LIVE" =~ $UUID ]]; then
                echo "## 12. read check: data shared between the live and the archived project (counts only)"
                echo "bindings on the same ad account (both projects):"
                q "select count(*) from project_integration_bindings a join project_integration_bindings b on a.external_account_id=b.external_account_id where a.project_id='$LIVE' and b.project_id='$ARCH';"
                echo "same client | live project's client = archived project's client:"
                q "select (select client_workspace_id from projects where id='$LIVE') = (select client_workspace_id from projects where id='$ARCH');"
              fi
            fi
            echo "== done"
