name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-KARAM2 $(date -u +%FT%TZ)"
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At' <<'SQL'
            BEGIN READ ONLY;
            \echo -- campaigns of openai/google accounts
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata|meta')::text,700), left(raw::text,500) from external_campaigns t where external_account_id in ('ae3333b2-7fc9-4f6b-b2a0-aca4c09ac15b','c9b4c316-a35e-4192-86a0-e6801c4c2c32','84ce2f9a-2cac-4240-b25e-68a52dde7d3a');
            \echo -- raw payloads (provider bodies) per account/resource, latest 3 each
            select provider, resource, window_start, window_end, normalised_rows, fetched_at, left(payload::text,500) from integration_raw_payloads where external_account_id in ('ae3333b2-7fc9-4f6b-b2a0-aca4c09ac15b','c9b4c316-a35e-4192-86a0-e6801c4c2c32','84ce2f9a-2cac-4240-b25e-68a52dde7d3a') order by fetched_at desc limit 14;
            \echo -- openai runs by day/status/reading
            select date_trunc('day',created_at)::date d, status, meta->>'no_data_reading' r, count(*), max(meta->>'last_delivery_date') from metric_sync_runs where provider='openai_ads' and project_id='c073e9c6-c70a-4276-87da-85338530b137' group by 1,2,3 order by 1 desc;
            \echo -- google daily metrics
            select metric_key, metric_date, original_currency, value, original_amount, converted_amount from daily_metrics where project_id='c073e9c6-c70a-4276-87da-85338530b137' and provider='google' order by metric_date, metric_key limit 40;
            \echo -- google run summary
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata|meta')::text,300), meta->>'no_data_reading', meta->>'currency_withheld', left(meta::text,900) from metric_sync_runs t where provider='google' and project_id='c073e9c6-c70a-4276-87da-85338530b137';
            \echo -- old google account runs ever
            select count(*), max(created_at) from metric_sync_runs where external_account_id='84ce2f9a-2cac-4240-b25e-68a52dde7d3a';
            \echo -- binding old google
            select id, is_active, sync_enabled, updated_at from project_integration_bindings where id='21082e97-84af-454d-9d01-5b37cebee0f4';
            \echo -- openai connection extra
            select status, last_error, token_expires_at, last_successful_sync_at, last_health_check_at, left(coalesce(scopes::text,''),100) from provider_connections where id='d76a0440-c972-4dc5-91f3-3703ba8ea95c';
            ROLLBACK;
            SQL
            echo "== END FACTS-KARAM2"
            exit 0
