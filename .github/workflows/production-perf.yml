name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "== FACTS-CR"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL' || echo "psql failed"
            BEGIN READ ONLY; select 'prov' q, provider, count(*), count(thumbnail_url) th, count(asset_url) a, count(video_url) v, count(preview_url) pv, count(cover_path) cov, sum(case when thumbnail_url is null and asset_url is null then 1 else 0 end) nosrc, sum(case when asset_expires_at < now() then 1 else 0 end) expired from external_creatives where is_demo=false group by 2 order by 2; ROLLBACK;
            BEGIN READ ONLY; select 'tt_media' q, raw->>'media' m, raw->>'media_reason' r, count(*), count(thumbnail_url) th, count(asset_url) a, count(video_url) v, count(cover_path) cov, sum(case when asset_expires_at<now() then 1 else 0 end) exp, sum(case when raw ? 'identity_id' then 1 else 0 end) has_ident from external_creatives where provider='tiktok' and is_demo=false group by 2,3 order by 4 desc; ROLLBACK;
            BEGIN READ ONLY; select 'tt_spark_fmt' q, raw->>'ad_format' f, count(*), count(thumbnail_url), count(cover_path) from external_creatives where provider='tiktok' and raw->>'media'='spark' group by 2 order by 3 desc; ROLLBACK;
            BEGIN READ ONLY; select 'tt_ads_ident' q, count(*), sum(case when raw ? 'identity_id' then 1 else 0 end) ident, sum(case when raw ? 'identity_authorized_bc_id' then 1 else 0 end) bc, string_agg(distinct raw->>'identity_type', ',') types from external_ads where provider='tiktok' and raw ? 'tiktok_item_id'; ROLLBACK;
            BEGIN READ ONLY; select 'tt_ad_keys' q, k, count(*) from external_ads, jsonb_object_keys(raw) k where provider='tiktok' group by 2 order by 3 desc limit 60; ROLLBACK;
            BEGIN READ ONLY; select 'snap_fmt' q, format, count(*), count(thumbnail_url) th, count(asset_url) a, count(video_url) v, count(cover_path) cov, sum(case when cards is not null then 1 else 0 end) cards, sum(case when asset_expires_at<now() then 1 else 0 end) exp from external_creatives where provider='snapchat' and is_demo=false group by 2 order by 3 desc; ROLLBACK;
            BEGIN READ ONLY; select 'snap_raw_keys' q, k, count(*) from external_creatives, jsonb_object_keys(raw) k where provider='snapchat' group by 2 order by 3 desc limit 30; ROLLBACK;
            BEGIN READ ONLY; select 'snap_ad_keys' q, k, count(*) from external_ads, jsonb_object_keys(raw) k where provider='snapchat' group by 2 order by 3 desc limit 40; ROLLBACK;
            BEGIN READ ONLY; select 'snap_vid_host' q, substring(video_url from '^https?://([^/]+)') h, count(*) from external_creatives where provider='snapchat' and video_url is not null group by 2 order by 3 desc limit 5; ROLLBACK;
            BEGIN READ ONLY; select 'meta_fmt' q, format, count(*), count(thumbnail_url) th, count(asset_url) a, count(video_url) v, count(cover_path) cov, sum(case when cards is not null then 1 else 0 end) cards, sum(case when asset_expires_at<now() then 1 else 0 end) exp from external_creatives where provider='meta' and is_demo=false group by 2 order by 3 desc; ROLLBACK;
            BEGIN READ ONLY; select 'other' q, provider, format, count(*), count(thumbnail_url), count(asset_url), count(video_url), count(cover_path), string_agg(distinct source_type, ',') from external_creatives where provider not in ('meta','tiktok','snapchat') and is_demo=false group by 2,3 order by 2,4 desc; ROLLBACK;
            BEGIN READ ONLY; select 'cols_cr' q, string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='external_creatives'; ROLLBACK;
            BEGIN READ ONLY; select 'cov_sample' q, provider, cover_path from external_creatives where cover_path is not null and provider in ('meta','tiktok') order by cover_cached_at desc limit 2; ROLLBACK;
            SQL
            echo "== covers on disk"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend sh -c 'ls /var/www/html/storage/app/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/media/covers -type f 2>/dev/null | wc -l; ls /var/www/html/storage/app/private/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/private/media/covers -type f 2>/dev/null | wc -l' || true
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo "local root=".config("filesystems.disks.local.root").PHP_EOL;' || true
            echo "== edge"
            P=$(docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "select cover_path from external_creatives where cover_path is not null and provider=lower(chr(77)||chr(69)||chr(84)||chr(65)) limit 1"' | tr -d '\r')
            for h in https://campaignshub.io https://api.campaignshub.io; do curl -s -o /dev/null -w "$h %{http_code} %{content_type} %{size_download}\n" "$h/media/covers/$P" || true; done
            echo "== END FACTS-CR"
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
