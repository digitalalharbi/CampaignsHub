name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            # SNAP-COVERS-RESYNC-001 (Owner-approved 2026-11-13). Counts only: no names, no ids, no URLs, no tokens.
            # hours=apply-snap-covers queues cover captures for SNAPCHAT only (creatives:backfill-covers --provider=snapchat --execute);
            # anything else is a read-only dry run.
            SNAP_Q="provider='snapchat' and is_demo=false"
            echo "== SNAP-COVERS $(date -u +%FT%TZ) mode=${HOURS}"
            echo "## A. Snapchat creatives: total | with cover | without cover | without cover but https source | without cover, no source"
            q "select count(*), count(*) filter (where cover_path is not null), count(*) filter (where cover_path is null), count(*) filter (where cover_path is null and (coalesce(thumbnail_url,'') like 'https://%' or coalesce(asset_url,'') like 'https://%')), count(*) filter (where cover_path is null and coalesce(thumbnail_url,'') not like 'https://%' and coalesce(asset_url,'') not like 'https://%') from external_creatives where $SNAP_Q;"
            echo "## A2. Snapchat without cover: cover_error | backing off now | n"
            q "select coalesce(cover_error,'(none)'), coalesce(cover_next_attempt_at > now(),false), count(*) from external_creatives where $SNAP_Q and cover_path is null group by 1,2 order by 3 desc;"
            echo "## A3. Snapchat without cover by format (images vs film): format | has video_url | n"
            q "select coalesce(format,'-'), coalesce(video_url,'')<>'', count(*) from external_creatives where $SNAP_Q and cover_path is null group by 1,2 order by 3 desc;"
            echo "## A4. Snapchat without cover, on a project with an active binding: n"
            q "select count(*) from external_creatives c where c.$SNAP_Q and c.cover_path is null and exists (select 1 from project_integration_bindings b where b.external_account_id=c.external_account_id and b.is_active);"
            echo "## A5. other providers without cover (baseline, must not change): provider | n"
            q "select provider, count(*) from external_creatives where provider<>'snapchat' and is_demo=false and cover_path is null group by 1 order by 1;"
            echo "## B. DRY RUN (command, snapchat only)"
            $DC exec -T backend php artisan creatives:backfill-covers --provider=snapchat --limit=2000 2>&1
            # SNAP-COVERS-RESYNC-002: scoped, guarded. Selection = snapchat, not demo, no cover, verdict provider_gave_none, not a dynamic collection.
            SEL="provider='snapchat' and is_demo=false and cover_path is null and cover_error='provider_gave_none' and coalesce(format,'')<>'collection_dynamic'"
            echo "## C0. GUARDED SELECTION (read-only): selected | of which backing off now | distinct accounts"
            q "select count(*), count(*) filter (where cover_next_attempt_at > now()), count(distinct external_account_id) from external_creatives where $SEL;"
            SELN=$(q "select count(*) from external_creatives where $SEL;" | grep -E '^[0-9]+$' | head -1)
            echo "selection count: ${SELN}"
            if [ "${HOURS}" = "apply-snap-covers" ]; then
              if [ -z "${SELN}" ] || [ "${SELN}" -lt 190 ] || [ "${SELN}" -gt 200 ]; then
                echo "ABORT: selection ${SELN} outside 190..200, nothing written"
                exit 0
              fi
              echo "## C1. CLEAR BACK-OFF (one transaction, assertion-guarded, only cover_next_attempt_at)"
              $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -v ON_ERROR_STOP=1 -At' 2>&1 <<EOF2
            BEGIN;
            DO \$\$
            DECLARE n int; m int;
            BEGIN
              SELECT count(*) INTO n FROM external_creatives WHERE $SEL;
              IF n < 190 OR n > 200 THEN RAISE EXCEPTION 'selection % out of range', n; END IF;
              UPDATE external_creatives SET cover_next_attempt_at = NULL WHERE $SEL AND cover_next_attempt_at IS NOT NULL;
              GET DIAGNOSTICS m = ROW_COUNT;
              IF m > n THEN RAISE EXCEPTION 'updated % > selected %', m, n; END IF;
              RAISE NOTICE 'backoff cleared on % rows (selected %)', m, n;
            END \$\$;
            COMMIT;
            EOF2
              echo "## C2. RUN (queues snapchat captures only)"
              $DC exec -T backend php artisan creatives:backfill-covers --provider=snapchat --limit=2000 --execute 2>&1
            else
              echo "## C. RUN skipped (dry run only)"
            fi
            echo "## D. AFTER: snapchat total | with cover | without cover | provider_gave_none; then other providers"
            q "select count(*), count(*) filter (where cover_path is not null), count(*) filter (where cover_path is null), count(*) filter (where cover_path is null and cover_error='provider_gave_none') from external_creatives where $SNAP_Q;"
            q "select count(*), count(*) filter (where cover_path is not null), count(*) filter (where cover_path is null) from external_creatives where $SNAP_Q;"
            q "select provider, count(*) from external_creatives where provider<>'snapchat' and is_demo=false and cover_path is null group by 1 order by 1;"
            echo "== END SNAP-COVERS"
            exit 0
