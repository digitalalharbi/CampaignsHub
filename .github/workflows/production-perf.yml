name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            P="(select id from projects where id::text like '57f56cce%' and deleted_at is null)"
            echo "== FACTS-GEO $(date -u +%FT%TZ)"
            echo "## Q0. project match count"
            q "select count(*) from projects where id::text like '57f56cce%' and deleted_at is null;"
            echo "## Q1. bindings: provider | purpose | active | n | account status | account tz"
            q "select b.provider,b.purpose,b.is_active,count(*),string_agg(distinct ea.status,','),string_agg(distinct coalesce(ea.timezone,'-'),',') from project_integration_bindings b join external_accounts ea on ea.id=b.external_account_id where b.project_id in $P group by 1,2,3 order by 1,2;"
            echo "## Q2. campaigns: provider | status | n | delivering 2026-11-12 (impressions>0)"
            q "select ec.provider,ec.status,count(*),count(*) filter (where exists (select 1 from daily_metrics dm where dm.external_campaign_id=ec.id and dm.metric_date='2026-11-12' and dm.metric_key='impressions' and dm.value>0)) from external_campaigns ec where ec.project_id in $P group by 1,2 order by 1,2;"
            echo "## Q3. ad sets: provider | n | active | targeting stored | keys seen | has countries | has cities | has locations | mentions najran | mentions makkah | max synced"
            q "select s.provider,count(*),count(*) filter (where s.status='active'),count(*) filter (where s.targeting is not null),(select string_agg(distinct k,',') from external_ad_sets s2, jsonb_object_keys(coalesce(s2.targeting,'{}'::jsonb)) k where s2.project_id in $P and s2.provider=s.provider),count(*) filter (where s.targeting ? 'countries'),count(*) filter (where s.targeting ? 'cities'),count(*) filter (where s.targeting ? 'locations'),count(*) filter (where s.targeting::text ~* '(najran|نجران)'),count(*) filter (where s.targeting::text ~* '(mecca|makkah|مكة)'),max(s.last_synced_at) from external_ad_sets s where s.project_id in $P group by s.provider order by 1;"
            echo "## Q3b. ad sets delivering 2026-11-12 (entity impressions>0): provider | n ad sets with delivery | of which targeting stored"
            q "select s.provider,count(distinct s.id),count(distinct s.id) filter (where s.targeting is not null) from external_ad_sets s join entity_daily_metrics e on e.entity_id=s.id where s.project_id in $P and e.metric_date='2026-11-12' and e.impressions>0 group by 1 order by 1;"
            echo "## Q3c. geo identifiers stored in targeting (country codes / TikTok location ids): provider | ad set id8 | status | countries | locations | cities count"
            q "select s.provider,left(s.id::text,8),s.status,coalesce(s.targeting->>'countries','-'),coalesce(s.targeting->>'locations','-'),coalesce(jsonb_array_length(case when jsonb_typeof(s.targeting->'cities')='array' then s.targeting->'cities' end),0) from external_ad_sets s where s.project_id in $P and s.status='active' order by 1,2 limit 60;"
            echo "## Q4. any stored geo/demographic delivery breakdown: tables named like geo/breakdown/audience/region"
            q "select table_name from information_schema.tables where table_schema='public' and (table_name ~* '(geo|breakdown|audience|region|demograph)') order by 1;"
            echo "## Q4b. daily_metrics raw carrying geo keys for the project on 2026-11-12: provider | rows | rows with region/country/city key"
            q "select provider,count(*),count(*) filter (where raw::text ~* '\"(region|country|city|dma|location)\"') from daily_metrics where project_id in $P and metric_date='2026-11-12' group by 1 order by 1;"
            echo "## Q5. last sync per provider for the project: provider | max data_freshness | max metric_date"
            q "select provider,max(data_freshness_at),max(metric_date) from daily_metrics where project_id in $P group by 1 order by 1;"
            echo "== END FACTS-GEO"
            exit 0
