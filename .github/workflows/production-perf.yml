name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            # OBJECTIVE-RECLASSIFY-RUN-001 (Owner-approved 2026-11-13). Counts only, no names.
            # hours=apply-reclassify runs the real reclassification after the dry run; anything else is dry run + recount only.
            echo "== RECLASSIFY $(date -u +%FT%TZ) mode=${HOURS}"
            echo "## A. BEFORE: active campaigns (spend or impressions, 7d) with objective other: platform | n"
            q "select coalesce(m.prov,'(none)'), count(*) from (select dm.unified_campaign_id id, string_agg(distinct dm.provider, '+') prov from daily_metrics dm where dm.metric_date>=current_date-7 and dm.unified_campaign_id is not null and coalesce(dm.is_demo,false)=false group by 1 having coalesce(sum(dm.value) filter (where dm.metric_key in ('spend','impressions')),0)>0) m join unified_campaigns uc on uc.id=m.id where uc.deleted_at is null and uc.objective='other' group by 1 order by 1;"
            echo "## A2. manual objectives: count | fingerprint"
            q "select count(*), md5(coalesce(string_agg(id::text||':'||objective, ',' order by id),'')) from unified_campaigns where objective_source='manual';"
            echo "## B. DRY RUN"
            $DC exec -T backend php artisan objectives:reclassify --dry-run 2>&1
            if [ "${HOURS}" = "apply-reclassify" ]; then
              echo "## C. RUN"
              $DC exec -T backend php artisan objectives:reclassify 2>&1
            else
              echo "## C. RUN skipped (dry run only)"
            fi
            echo "## D. AFTER: active campaigns with objective other: platform | n"
            q "select coalesce(m.prov,'(none)'), count(*) from (select dm.unified_campaign_id id, string_agg(distinct dm.provider, '+') prov from daily_metrics dm where dm.metric_date>=current_date-7 and dm.unified_campaign_id is not null and coalesce(dm.is_demo,false)=false group by 1 having coalesce(sum(dm.value) filter (where dm.metric_key in ('spend','impressions')),0)>0) m join unified_campaigns uc on uc.id=m.id where uc.deleted_at is null and uc.objective='other' group by 1 order by 1;"
            echo "## D2. manual objectives after: count | fingerprint (must equal A2)"
            q "select count(*), md5(coalesce(string_agg(id::text||':'||objective, ',' order by id),'')) from unified_campaigns where objective_source='manual';"
            echo "== END RECLASSIFY"
            exit 0
