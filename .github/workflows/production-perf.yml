name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-MAP $(date -u +%FT%TZ)"
            echo "## feature flags (names and boolean values only)"
            grep -E '^FEATURE_' deploy/backend.production.env | sed -E 's/^([A-Z_0-9]+)=(true|false|1|0)$/\1=\2/; t; s/^([A-Z_0-9]+)=.*/\1=<non-boolean omitted>/'
            echo "## tenants by account_type/plan/portal"
            q "select account_type,subscription_plan,count(*),count(*) filter (where onboarding_completed_at is not null) from tenants group by 1,2 order by 3 desc;"
            echo "## leads by provider/source/status"
            q "select provider,source,status,count(*),count(*) filter (where owner_id is null) from leads group by 1,2,3 order by 4 desc limit 30;"
            echo "## app notifications by type/source"
            q "select source,type,count(*),count(*) filter (where read_at is null) from app_notifications group by 1,2 order by 3 desc limit 40;"
            echo "## mail failures by week"
            q "select date_trunc('week',created_at)::date,status,count(*) from mail_deliveries where created_at>now()-interval '8 weeks' group by 1,2 order by 1,2;"
            echo "## mail failed reasons (error class only)"
            q "select kind,left(coalesce(error_class,''),60),count(*) from mail_deliveries where status='failed' group by 1,2 order by 3 desc limit 15;"
            echo "## invitations by portal/accepted"
            q "select portal,(accepted_at is not null) accepted,delivery_status,count(*),min(created_at)::date from workspace_invitations group by 1,2,3 order by 4 desc;"
            echo "## request types and statuses defined"
            q "select 'types',count(*),count(*) filter (where is_active) from request_types union all select 'statuses',count(*),0 from request_statuses;"
            echo "## clients and projects"
            q "select 'client_workspaces',count(*) from client_workspaces union all select 'projects',count(*) from projects;"
            echo "## lead forms by status"
            q "select status,count(*) from lead_forms group by 1;"
            echo "## registration to tenant conversion times (hours, buckets)"
            q "select state,round(avg(extract(epoch from (state_changed_at-created_at))/3600)::numeric,1) from registration_requests group by 1;"
            echo "== END FACTS-MAP"
            exit 0
