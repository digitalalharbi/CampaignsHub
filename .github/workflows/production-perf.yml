name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-PATHS $(date -u +%FT%TZ)"
            echo "## Q1. 1KCOFFEE campaigns with spend last 30d: provider | campaign | objective | source | platform value | ad sets | spend"
            q "select uc_p, left(uc_id,8), obj, src, pov, (select count(*) from external_ad_sets s where s.unified_campaign_id::text=uc_id), round(sp::numeric,0) from (select dm.provider uc_p, dm.unified_campaign_id::text uc_id, uc.objective obj, uc.objective_source src, coalesce(uc.objective_platform_value,'-') pov, sum(dm.value) filter (where dm.metric_key='spend') sp from daily_metrics dm join unified_campaigns uc on uc.id=dm.unified_campaign_id where dm.project_id in (select id from projects where id::text like '57f56cce%') and dm.metric_date>=current_date-30 group by 1,2,3,4,5) z where sp>0 order by 1,7 desc;"
            echo "## Q2. 1KCOFFEE ad sets of spending campaigns: provider | campaign | ad set | status | optimization_goal | destination_type | bid_strategy | ad-set spend 30d | revenue | conversions | purchases | lpv | clicks"
            q "select s.provider, left(s.unified_campaign_id::text,8), left(s.id::text,8), s.status, coalesce(s.optimization_goal,'-'), coalesce(s.destination_type,'-'), coalesce(s.bid_strategy,'-'), round(coalesce(sum(e.spend),0)::numeric,0), round(coalesce(sum(e.revenue),0)::numeric,0), round(coalesce(sum(e.conversions),0)::numeric,0), round(coalesce(sum(e.purchases),0)::numeric,0), round(coalesce(sum(e.landing_page_views),0)::numeric,0), round(coalesce(sum(e.clicks),0)::numeric,0) from external_ad_sets s left join entity_daily_metrics e on e.entity_type='ad_set' and e.entity_id=s.id and e.metric_date>=current_date-30 where s.project_id in (select id from projects where id::text like '57f56cce%') group by 1,2,3,4,5,6,7 having coalesce(sum(e.spend),0)>0 order by 1,2,8 desc;"
            echo "## Q3. 1KCOFFEE campaign vs ad-set spend reconciliation 30d: provider | campaign spend (daily_metrics) | ad-set spend (entity) | ad sets with rows"
            q "select a.provider, round(a.sp::numeric,0), round(coalesce(b.sp,0)::numeric,0), coalesce(b.n,0) from (select provider, sum(value) sp from daily_metrics where project_id in (select id from projects where id::text like '57f56cce%') and metric_date>=current_date-30 and metric_key='spend' group by 1) a left join (select provider, sum(spend) sp, count(distinct entity_id) n from entity_daily_metrics where project_id in (select id from projects where id::text like '57f56cce%') and entity_type='ad_set' and metric_date>=current_date-30 group by 1) b on b.provider=a.provider order by 1;"
            echo "## Q4. all tenants: campaigns whose ad sets carry more than one optimization_goal (spending 30d): provider | n campaigns | example goal sets"
            q "select provider, count(*), string_agg(distinct goals, ' ; ') from (select s.provider, s.unified_campaign_id, string_agg(distinct coalesce(s.optimization_goal,'-'), ',' order by coalesce(s.optimization_goal,'-')) goals, count(distinct coalesce(s.optimization_goal,'-')) ng from external_ad_sets s where exists (select 1 from entity_daily_metrics e where e.entity_type='ad_set' and e.entity_id=s.id and e.metric_date>=current_date-30 and e.spend>0) group by 1,2) z where ng>1 group by 1 order by 1;"
            echo "## Q5. all tenants: optimization_goal x destination_type on spending ad sets 30d: provider | goal | destination | n"
            q "select s.provider, coalesce(s.optimization_goal,'-'), coalesce(s.destination_type,'-'), count(*) from external_ad_sets s where exists (select 1 from entity_daily_metrics e where e.entity_type='ad_set' and e.entity_id=s.id and e.metric_date>=current_date-30 and e.spend>0) group by 1,2,3 order by 1,4 desc;"
            echo "== END FACTS-PATHS"
            exit 0
