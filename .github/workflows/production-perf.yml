name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "── read-only counts"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T db psql -U campaignshub -d campaignshub -At <<'SQL'
            BEGIN READ ONLY;
            select 'binding_columns', string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='project_integration_bindings';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'account_bindings', left(b.project_id::text,8), row_to_json(b)::text from project_integration_bindings b where b.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'account_campaigns_by_project', left(c.project_id::text,8), count(*) from external_campaigns c where c.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962' group by 1;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'account_unified_by_project', left(u.project_id::text,8), count(*) from unified_campaigns u where u.id in (select unified_campaign_id from external_campaigns where external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962') group by 1;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'creatives_by_campaign_project', left(c.project_id::text,8), count(*) from external_creatives x join external_campaigns c on c.id=x.external_campaign_id where c.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962' group by 1;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'creatives_by_own_project', left(x.project_id::text,8), count(*) from external_creatives x join external_campaigns c on c.id=x.external_campaign_id where c.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962' group by 1;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'ad_rows', left(x.id::text,8), left(x.project_id::text,8), left(c.project_id::text,8), left(c.external_account_id::text,8), x.created_at::date from external_creatives x left join external_campaigns c on c.id=x.external_campaign_id where x.id in ('952928f9-948c-46fc-ad7c-746bf1e15043','67ffcf3b-857b-46d9-9f30-8d2bbf5692c2','92615695-c7d2-4ee9-8441-902486e6ab09','b5caf190-c185-4c4b-824f-70cc400c0a1a','8ccd0ef9-6c3d-48e0-9c96-7ec6b4ee81ea');
            ROLLBACK;
            BEGIN READ ONLY;
            select 'daily_metrics_by_project', left(m.project_id::text,8), count(*), min(m.metric_date), max(m.metric_date) from daily_metrics m where m.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962' group by 1;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'creative_daily_by_project', left(m.project_id::text,8), count(*) from creative_daily_metrics m where m.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962' group by 1;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'report_project_other_accounts', left(b.external_account_id::text,8), b.provider from project_integration_bindings b where b.project_id='e63c1e5b'||substr(b.project_id::text,9) limit 0;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'projects_of_tenant', count(*) from projects p where p.tenant_id in (select tenant_id from reports where id::text like '3f9a568a%');
            ROLLBACK;
            BEGIN READ ONLY;
            select 'report_project', left(p.id::text,8), left(p.client_workspace_id::text,8) from projects p where p.id::text like 'e63c1e5b%';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'other_projects_with_this_account', left(b.project_id::text,8), left(p.client_workspace_id::text,8) from project_integration_bindings b join projects p on p.id=b.project_id where b.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962';
            ROLLBACK;
            SQL
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
