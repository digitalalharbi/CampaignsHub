name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "── read-only counts"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T db psql -U campaignshub -d campaignshub -At <<'SQL'
            BEGIN READ ONLY;
            select 'other_account', left(a.id::text,8), a.provider, left(a.tenant_id::text,8), a.created_at::date from external_accounts a where a.id::text like '8e164fe6%';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'other_account_bindings', left(b.project_id::text,8), left(b.client_workspace_id::text,8), b.is_active, b.provider from project_integration_bindings b where b.external_account_id::text like '8e164fe6%';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'report_project_bindings', left(b.external_account_id::text,8), b.provider, b.is_active from project_integration_bindings b where b.project_id::text like 'e63c1e5b%';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'scoped_account_creatives', count(*) from external_creatives x join external_campaigns c on c.id=x.external_campaign_id where c.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'other_account_creatives_by_project', left(x.project_id::text,8), count(*) from external_creatives x join external_campaigns c on c.id=x.external_campaign_id where c.external_account_id::text like '8e164fe6%' group by 2;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'scoped_account_campaigns_by_project', left(c.project_id::text,8), count(*) from external_campaigns c where c.external_account_id='a50a065f-31b2-4541-8054-a10cd2b73962' group by 2;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'other_account_campaigns_by_project', left(c.project_id::text,8), count(*) from external_campaigns c where c.external_account_id::text like '8e164fe6%' group by 2;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'completed_reports_with_account_scope', count(*) from reports r where r.status='completed' and r.scope ? 'account_ids';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'active_snapshot_links_on_them', count(*) from report_shares s join reports r on r.id=s.report_id where s.revoked_at is null and s.mode='snapshot' and r.scope ? 'account_ids';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'active_live_links_with_account_scope', count(*) from report_shares s where s.revoked_at is null and s.mode='live' and s.scope ? 'account_ids';
            ROLLBACK;
            BEGIN READ ONLY;
            select 'projects_with_two_or_more_active_accounts_on_one_provider', count(*) from (select project_id, provider from project_integration_bindings where is_active group by 1,2 having count(*)>1) x;
            ROLLBACK;
            BEGIN READ ONLY;
            select 'accounts_actively_bound_to_two_or_more_projects', count(*) from (select external_account_id from project_integration_bindings where is_active group by 1 having count(distinct project_id)>1) x;
            ROLLBACK;
            SQL
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
