name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-VERIFY $(date -u +%FT%TZ)"
            echo "## S. last alert sweep marks: max(last_triggered_at), max(resolved_at) of no_results"
            q "select max(last_triggered_at),max(resolved_at) from alert_events where type='no_results';"
            echo "## A. Bardisi no_results events: event id8 | campaign id8 | status | resolved_at | closed_reason | recovered_at set"
            q "select left(ae.id::text,8),left(ae.entity_id,8),ae.status,ae.resolved_at,coalesce(ae.context->>'closed_reason','-'),ae.context ? 'recovered_at' from alert_events ae where ae.type='no_results' and ae.project_id in (select id from projects where name ilike '%برديسي%') order by ae.created_at;"
            echo "## B. app_notifications since deploy on Bardisi campaigns: count | recovered-titled"
            q "select count(*),count(*) filter (where title like 'Recovered:%' or title_ar like 'تعافى:%') from app_notifications where created_at>'2026-11-12 12:59:20+00' and entity_id in (select id::text from unified_campaigns where project_id in (select id from projects where name ilike '%برديسي%'));"
            echo "## B2. app_notifications since deploy platform-wide titled Recovered: Spending with no results"
            q "select count(*) from app_notifications where created_at>'2026-11-12 12:59:20+00' and title like 'Recovered: Spending with no results%';"
            echo "## B3. mail_deliveries / digest_sends columns"
            q "select table_name,string_agg(column_name,',' order by ordinal_position) from information_schema.columns where table_name in ('mail_deliveries','digest_sends') group by 1;"
            echo "## C. open no_results now"
            q "select count(*) from alert_events where type='no_results' and status in ('open','snoozed');"
            echo "## C2. no_results resolved since deploy: closed_reason (or recovered) | count"
            q "select coalesce(context->>'closed_reason',case when context ? 'recovered_at' then 'recovered' else 'manual/other' end),count(*) from alert_events where type='no_results' and resolved_at>'2026-11-12 12:59:20+00' group by 1 order by 1;"
            echo "## D. no_results events triggered since deploy: family | result_key | status | count"
            q "select case uc.objective when 'traffic' then 'traffic' when 'landing_page_views' then 'traffic' when 'awareness' then 'awareness' when 'reach' then 'awareness' when 'engagement' then 'engagement' when 'video_views' then 'video' when 'leads' then 'leads' when 'app_installs' then 'app' when 'sales' then 'sales' when 'conversions' then 'sales' when 'purchases' then 'sales' when 'add_to_cart' then 'sales' else 'unknown' end,coalesce(ae.context->>'result_key','-'),ae.status,count(*) from alert_events ae left join unified_campaigns uc on uc.id::text=ae.entity_id where ae.type='no_results' and ae.last_triggered_at>'2026-11-12 12:59:20+00' group by 1,2,3 order by 1;"
            echo "## D2. open no_results by family and whether raised by new code (result_key set)"
            q "select case uc.objective when 'traffic' then 'traffic' when 'landing_page_views' then 'traffic' when 'awareness' then 'awareness' when 'reach' then 'awareness' when 'engagement' then 'engagement' when 'video_views' then 'video' when 'leads' then 'leads' when 'app_installs' then 'app' when 'sales' then 'sales' when 'conversions' then 'sales' when 'purchases' then 'sales' when 'add_to_cart' then 'sales' else 'unknown' end,ae.context ? 'result_key',count(*) from alert_events ae left join unified_campaigns uc on uc.id::text=ae.entity_id where ae.type='no_results' and ae.status in ('open','snoozed') group by 1,2 order by 1;"
            echo "== END FACTS-VERIFY"
            exit 0
