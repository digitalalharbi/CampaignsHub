name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "== FACTS-CR"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL' || echo "psql failed"
            BEGIN READ ONLY; select 'cols_cr' q, string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='external_creatives'; ROLLBACK;
            BEGIN READ ONLY; select 'cols_ads' q, string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='external_ads'; ROLLBACK;
            BEGIN READ ONLY; select 'cr_prov' q, provider, is_demo, count(*), count(campaign_id) with_camp, count(external_account_id) with_acct, count(project_id) with_proj, count(thumbnail_url) th, count(cover_path) cov, min(created_at)::date mn, max(created_at) mx, max(updated_at) upd from external_creatives where provider='openai_ads' group by 2,3; ROLLBACK;
            BEGIN READ ONLY; select 'cr_fmt' q, format, status, count(*), count(campaign_id), count(thumbnail_url), count(cover_path) from external_creatives where provider='openai_ads' group by 2,3 order by 4 desc; ROLLBACK;
            BEGIN READ ONLY; select 'cr_created_day' q, created_at::date d, count(*) from external_creatives where provider='openai_ads' group by 2 order by 2 desc limit 8; ROLLBACK;
            BEGIN READ ONLY; select 'ads_prov' q, provider, status, count(*), count(creative_id) with_creative, count(unified_campaign_id) with_ucamp, count(external_ad_set_id) with_adset, max(updated_at) upd from external_ads where provider='openai_ads' group by 2,3; ROLLBACK;
            BEGIN READ ONLY; select 'ads_creative_exist' q, count(*) ads, sum(case when a.creative_id is not null and exists(select 1 from external_creatives c where c.id=a.creative_id) then 1 else 0 end) creative_row_exists from external_ads a where a.provider='openai_ads'; ROLLBACK;
            BEGIN READ ONLY; select 'camp_openai' q, status, count(*), count(unified_campaign_id) with_u, max(updated_at) upd from external_campaigns where provider='openai_ads' group by 2; ROLLBACK;
            BEGIN READ ONLY; select 'cr_ucamp_with_dm' q, count(*) total, sum(case when c.campaign_id in (select unified_campaign_id from daily_metrics where provider='openai_ads') then 1 else 0 end) camp_has_metrics from external_creatives c where c.provider='openai_ads'; ROLLBACK;
            BEGIN READ ONLY; select 'cr_ran_in_dm' q, count(*) total, sum(case when exists(select 1 from external_ads a where a.creative_id=c.id and a.unified_campaign_id in (select unified_campaign_id from daily_metrics where provider='openai_ads')) then 1 else 0 end) ran_in_metric_camp from external_creatives c where c.provider='openai_ads'; ROLLBACK;
            BEGIN READ ONLY; select 'dm_openai' q, count(distinct unified_campaign_id) camps, min(date) mn, max(date) mx from daily_metrics where provider='openai_ads'; ROLLBACK;
            BEGIN READ ONLY; select 'accts' q, count(*), string_agg(distinct status,',') from external_accounts where provider='openai_ads'; ROLLBACK;
            BEGIN READ ONLY; select 'cr_removed_cols' q, count(*) from external_creatives where provider='openai_ads' and (deleted_at is not null); ROLLBACK;
            BEGIN READ ONLY; select 'cr_other_prov' q, provider, count(*), max(created_at) mx from external_creatives where provider<>'openai_ads' and is_demo=false group by 2; ROLLBACK;
            SQL
            echo "== covers on disk"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend sh -c 'ls /var/www/html/storage/app/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/media/covers -type f 2>/dev/null | wc -l; ls /var/www/html/storage/app/private/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/private/media/covers -type f 2>/dev/null | wc -l' || true
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo "local root=".config("filesystems.disks.local.root").PHP_EOL;' || true
            echo "== END FACTS-CR"
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
