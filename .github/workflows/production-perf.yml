name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          command_timeout: 55m
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            p() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | " -v ON_ERROR_STOP=1' 2>&1; }
            sizes() {
              df -h / | tail -1
              echo "select pg_size_pretty(pg_total_relation_size('integration_raw_payloads')), pg_size_pretty(pg_database_size(current_database())), (select count(*) from integration_raw_payloads), (select count(*) from integration_raw_payloads where fetched_at < now() - interval '30 days');" | p
            }
            # RAW-RETENTION-30-001 compaction, Owner-approved 2026-11-19 («نفذ الضغط بعد الدمج»).
            # Deletes ONLY integration_raw_payloads rows older than 30 days (the new retention), then
            # rewrites that one table. Sync workers are paused so nothing waits on the lock; the site stays up.
            echo "== BEFORE $(date -u +%FT%TZ)"; sizes
            trap '$DC start queue scheduler >/dev/null 2>&1; echo "workers restarted (trap)"' EXIT
            $DC stop queue scheduler
            echo "== DELETE $(date -u +%T)"
            echo "delete from integration_raw_payloads where fetched_at < now() - interval '30 days';" | p
            echo "== VACUUM FULL $(date -u +%T)"
            echo "set lock_timeout = '120s'; vacuum (full, analyze) integration_raw_payloads;" | p
            echo "== DONE $(date -u +%T)"
            $DC start queue scheduler
            trap - EXIT
            echo "== AFTER"; sizes
            $DC ps --format '{{.Service}} {{.State}}' | grep -E "queue|scheduler|backend"
            curl -s -o /dev/null -w "health %{http_code} %{time_total}s\n" https://api.campaignshub.io/api/v1/health
            exit 0
