name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "── read-only facts"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F " | " -v ON_ERROR_STOP=0' <<'SQL'
            BEGIN READ ONLY; select 'P1 active memberships by portal', portal, count(*) from memberships where status='active' group by portal order by portal; ROLLBACK;
            BEGIN READ ONLY; select 'P2 portal members with a password set', count(*) from memberships m join users u on u.id=m.user_id where m.status='active' and m.portal='portal' and u.password is not null; ROLLBACK;
            BEGIN READ ONLY; select 'P3 portal members with an oauth identity', count(distinct m.user_id) from memberships m join oauth_identities o on o.user_id=m.user_id where m.status='active' and m.portal='portal'; ROLLBACK;
            BEGIN READ ONLY; select 'P4 portal members disabled', count(*) from memberships m join users u on u.id=m.user_id where m.status='active' and m.portal='portal' and u.disabled_at is not null; ROLLBACK;
            BEGIN READ ONLY; select 'P5 portal members who also hold another portal', count(distinct m.user_id) from memberships m where m.status='active' and m.portal='portal' and exists (select 1 from memberships o where o.user_id=m.user_id and o.status='active' and o.portal<>'portal'); ROLLBACK;
            BEGIN READ ONLY; select 'P6 portal members last used within 90 days', count(*) from memberships where status='active' and portal='portal' and last_used_at > now() - interval '90 days'; ROLLBACK;
            BEGIN READ ONLY; select 'P7 users holding more than one active membership', count(*) from (select user_id from memberships where status='active' group by user_id having count(*)>1) x; ROLLBACK;
            BEGIN READ ONLY; select 'P8 live client portal tokens', count(*) from client_portal_tokens where revoked_at is null and expires_at > now(); ROLLBACK;
            BEGIN READ ONLY; select 'P9 requests with a contact email', count(*) from external_requests where contact_email is not null; ROLLBACK;
            SQL
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
