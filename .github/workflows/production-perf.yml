name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            P="(select id from projects where id::text like 'c073e9c6%' limit 1)"
            CAMPS="(select distinct e.entity_id::uuid from alert_events e where e.type='no_results' and e.created_at>=now()-interval '30 days' and (e.project_id=$P or e.entity_id in (select id::text from unified_campaigns where project_id=$P)))"
            echo "== FACTS-KARAM-NORESULTS $(date -u +%FT%TZ) db_now=$(q 'select now()' | sed -n 2p)"
            echo "## P. project | tenant | workspace tz"
            q "select left(p.id::text,8),left(p.tenant_id::text,8),coalesce(cw.timezone,'(null)') from projects p left join client_workspaces cw on cw.id=p.client_workspace_id where p.id=$P;"
            echo "## R. no_results rules for the tenant: rule | project | threshold | cooldown_min | active | channels"
            q "select left(r.id::text,8),coalesce(left(r.project_id::text,8),'TENANT'),r.threshold::text,r.cooldown_minutes,r.active,r.channels::text from alert_rules r where r.type='no_results' and r.tenant_id=(select tenant_id from projects where id=$P) order by 2;"
            echo "## E. no_results events (30d): event | rule | campaign | status | created | last_triggered | resolved | ctx.days | ctx.spend | ctx.result | result_key | closed_reason | recovered_at"
            q "select left(e.id::text,8),left(e.rule_id::text,8),left(e.entity_id,8),e.status,to_char(e.created_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),to_char(e.last_triggered_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),coalesce(to_char(e.resolved_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),'-'),e.context->>'days',round((e.context->>'spend')::numeric,0),e.context->>'conversions',coalesce(e.context->>'result_key','-'),coalesce(e.context->>'closed_reason','-'),coalesce(e.context->>'recovered_at','-') from alert_events e where e.type='no_results' and e.created_at>=now()-interval '30 days' and (e.project_id=$P or e.entity_id in (select id::text from unified_campaigns where project_id=$P)) order by e.created_at;"
            echo "## C. those campaigns, stored vs platform: campaign | uc.status | uc.ends_on | uc.objective | uc.updated | deleted | provider | ec.status | ec.last_synced | ec.updated | ec.ends_at | raw status | raw op_status | raw secondary | raw effective | raw configured | raw.raw status"
            q "select left(uc.id::text,8),uc.status,coalesce(uc.ends_on::text,'-'),uc.objective,to_char(uc.updated_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),(uc.deleted_at is not null),ec.provider,ec.status,coalesce(to_char(ec.last_synced_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),'-'),to_char(ec.updated_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),coalesce(to_char(ec.ends_at,'YYYY-MM-DD'),'-'),coalesce(ec.raw->>'status','-'),coalesce(ec.raw->>'operation_status','-'),coalesce(ec.raw->>'secondary_status','-'),coalesce(ec.raw->>'effective_status','-'),coalesce(ec.raw->>'configured_status','-'),coalesce(ec.raw->'raw'->>'status',ec.raw->'raw'->>'operation_status','-') from unified_campaigns uc left join external_campaigns ec on ec.unified_campaign_id=uc.id where uc.id in $CAMPS order by 1;"
            echo "## C2. raw top-level keys per provider (names only)"
            q "select ec.provider,(select string_agg(k,',' order by k) from jsonb_object_keys(ec.raw) k) from external_campaigns ec where ec.unified_campaign_id in $CAMPS and jsonb_typeof(ec.raw)='object' group by 1,2 limit 6;"
            echo "## D. delivery per campaign (Riyadh dates): campaign | last day spend>0 | last day imp>0 | days spend>0 in last 7 (to yesterday) | spend>0 yesterday | imp yesterday | spend 3d | spend 7d"
            q "select left(dm.unified_campaign_id::text,8),max(metric_date) filter (where metric_key='spend' and value>0),max(metric_date) filter (where metric_key='impressions' and value>0),count(distinct metric_date) filter (where metric_key='spend' and value>0 and metric_date>=(now() at time zone 'Asia/Riyadh')::date-7 and metric_date<(now() at time zone 'Asia/Riyadh')::date),bool_or(metric_key='spend' and value>0 and metric_date=(now() at time zone 'Asia/Riyadh')::date-1),coalesce(sum(value) filter (where metric_key='impressions' and metric_date=(now() at time zone 'Asia/Riyadh')::date-1),0)::bigint,round(coalesce(sum(value) filter (where metric_key='spend' and metric_date>=(now() at time zone 'Asia/Riyadh')::date-3),0),0),round(coalesce(sum(value) filter (where metric_key='spend' and metric_date>=(now() at time zone 'Asia/Riyadh')::date-7),0),0) from daily_metrics dm where dm.unified_campaign_id in $CAMPS and coalesce(dm.is_demo,false)=false group by 1 order by 1;"
            echo "## D2. daily spend>0 / imp>0 flags per campaign, last 14 days: campaign | date | spend>0 | imp>0"
            q "select left(unified_campaign_id::text,8),metric_date,bool_or(metric_key='spend' and value>0),bool_or(metric_key='impressions' and value>0) from daily_metrics where unified_campaign_id in $CAMPS and metric_date>=(now() at time zone 'Asia/Riyadh')::date-14 and coalesce(is_demo,false)=false group by 1,2 order by 1,2;"
            echo "## A. all project campaigns: uc.status x ec.status x delivered-yesterday : count"
            q "select uc.status,coalesce(ec.status,'(no ext)'),exists(select 1 from daily_metrics d where d.unified_campaign_id=uc.id and d.metric_key in ('spend','impressions') and d.value>0 and d.metric_date=(now() at time zone 'Asia/Riyadh')::date-1),count(*) from unified_campaigns uc left join external_campaigns ec on ec.unified_campaign_id=uc.id where uc.project_id=$P and uc.deleted_at is null group by 1,2,3 order by 4 desc;"
            echo "## N. in-app notifications about no-results in this project, 14d: entity | n | first | last"
            q "select left(n.entity_id::text,8),count(*),min(to_char(n.created_at at time zone 'Asia/Riyadh','MM-DD HH24:MI')),max(to_char(n.created_at at time zone 'Asia/Riyadh','MM-DD HH24:MI')) from notifications n where n.project_id=$P and n.created_at>=now()-interval '14 days' and (n.title_ar like '%بدون نتائج%' or n.title like '%no results%') group by 1 order by 2 desc;"
            echo "## S. latest sync runs for the project: status | started | finished"
            q "select status,to_char(started_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),coalesce(to_char(finished_at at time zone 'Asia/Riyadh','MM-DD HH24:MI'),'-') from integration_sync_runs where project_id=$P order by started_at desc limit 6;"
            echo "== END FACTS-KARAM-NORESULTS"
            exit 0
