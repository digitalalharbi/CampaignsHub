name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-KARAM $(date -u +%FT%TZ)"
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At' <<'SQL'
            BEGIN READ ONLY;
            \echo -- project
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata')::text,500) from projects t where id='c073e9c6-c70a-4276-87da-85338530b137';
            \echo -- bindings
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata')::text,700) from project_integration_bindings t where project_id='c073e9c6-c70a-4276-87da-85338530b137';
            \echo -- accounts bound
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata')::text,700) from external_accounts t where id in (select external_account_id from project_integration_bindings where project_id='c073e9c6-c70a-4276-87da-85338530b137');
            \echo -- connections of those accounts
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata')::text,700) from provider_connections t where id in (select provider_connection_id from external_accounts where id in (select external_account_id from project_integration_bindings where project_id='c073e9c6-c70a-4276-87da-85338530b137'));
            \echo -- credential state (no payload)
            select c.provider, c.status, c.expires_at, c.last_rotated_at from integration_credentials c where c.id in (select credential_id from provider_connections where id in (select provider_connection_id from external_accounts where id in (select external_account_id from project_integration_bindings where project_id='c073e9c6-c70a-4276-87da-85338530b137')));
            \echo -- metric_sync_runs 14d
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata')::text,600) from metric_sync_runs t where project_id='c073e9c6-c70a-4276-87da-85338530b137' and created_at > now()-interval '14 days' order by created_at desc limit 40;
            \echo -- metric runs by provider/status
            select provider,status,count(*),max(finished_at),sum(metrics_upserted) from metric_sync_runs where project_id='c073e9c6-c70a-4276-87da-85338530b137' and created_at > now()-interval '14 days' group by 1,2 order by 1,2;
            \echo -- integration_sync_runs 14d
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(t)) e(k,v) where k !~* 'token|secret|credential|password|payload|encrypted|raw|metadata')::text,600) from integration_sync_runs t where created_at > now()-interval '14 days' and to_jsonb(t)::text like '%c073e9c6-c70a-4276-87da-85338530b137%' order by created_at desc limit 30;
            \echo -- daily_metrics by provider/account
            select provider, external_account_id, original_currency, project_currency, count(*) n, count(*) filter (where value is null) null_value, min(metric_date), max(metric_date), count(distinct external_campaign_id) campaigns from daily_metrics where project_id='c073e9c6-c70a-4276-87da-85338530b137' group by 1,2,3,4 order by 1;
            \echo -- external_campaigns by provider/status
            select provider, status, count(*) from external_campaigns where external_account_id in (select external_account_id from project_integration_bindings where project_id='c073e9c6-c70a-4276-87da-85338530b137') group by 1,2 order by 1,2;
            \echo -- fx pairs
            select base_currency, quote_currency, count(*), min(rate_date), max(rate_date), min(source) from currency_rates group by 1,2 order by 1,2;
            \echo -- failed jobs 14d by class
            select substring(payload from '"displayName":"([^"]+)"') job, count(*), max(failed_at), left(min(exception),200) from failed_jobs where failed_at > now()-interval '14 days' group by 1 order by 2 desc limit 15;
            \echo -- google/chatgpt connections overall
            select provider, status, count(*), max(last_successful_sync_at), max(last_health_check_at) from provider_connections where provider in ('google','google_ads','chatgpt','chatgpt_ads','openai','openai_ads') group by 1,2;
            ROLLBACK;
            SQL
            echo "== END FACTS-KARAM"
            exit 0
