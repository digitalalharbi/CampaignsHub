name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== GEO-PROBE $(date -u +%FT%TZ) (Owner approval 2026-11-13; read-only: the probe stores nothing)"
            PROJECT=$(q "select id from projects where id::text like '57f56cce%' and deleted_at is null;" | grep -E '^[0-9a-f-]{36}$' | head -1)
            echo "project resolved: ${PROJECT:0:8}"
            for PROV in meta snapchat; do
              for ACC in $(q "select ea.id from project_integration_bindings b join external_accounts ea on ea.id=b.external_account_id where b.project_id='${PROJECT}' and b.is_active and b.provider='${PROV}';" | grep -E '^[0-9a-f-]{36}$'); do
                echo "── ${PROV} account ${ACC:0:8}"
                $DC exec -T backend php artisan audience:breakdown-probe "$ACC" --project="$PROJECT" --from=2026-11-12 --to=2026-11-12 --dimension=region || echo "PROBE FAILED: see above"
              done
            done
            echo "## stored audience rows for the project on 2026-11-12 (must be 0 before any approved storage): provider | rows"
            q "select provider,count(*) from audience_breakdown_rows where project_id='${PROJECT}' and metric_date='2026-11-12' group by 1;"
            echo "== END GEO-PROBE"
            exit 0
