name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "── read-only facts"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F " | " -v ON_ERROR_STOP=0' <<'SQL'
            BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R1 role and portal', t.role, t.portal from t;
            ROLLBACK; BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R2 holds', p.key from t join role_user ru on ru.user_id=t.user_id join roles r on r.id=ru.role_id and (r.tenant_id=t.tenant_id or r.tenant_id is null) join permission_role pr2 on pr2.role_id=r.id join permissions p on p.id=pr2.permission_id where p.key in ('settings.manage','projects.view.all','clients.view_all');
            ROLLBACK; BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R3 projects in its client scope', count(*) from pr;
            ROLLBACK; BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R4 tasks there', count(*) from tasks x join pr on pr.pid=x.project_id;
            ROLLBACK; BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R5 reports there', count(*) from reports x join pr on pr.pid=x.project_id;
            ROLLBACK; BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R6 delivery packs there', count(*) from delivery_packs x join pr on pr.pid=x.project_id;
            ROLLBACK; BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R7 message threads there', count(*) from message_threads x join pr on pr.pid=x.project_id;
            ROLLBACK; BEGIN READ ONLY;
            with t as (select m.id mid, m.user_id, m.tenant_id, m.role, m.portal from memberships m where m.status='active' and exists (select 1 from membership_scopes s where s.membership_id=m.id and s.scope_type='client_workspace') and not exists (select 1 from project_memberships p where p.user_id=m.user_id and p.tenant_id=m.tenant_id and p.status='active')), pr as (select p.id pid from projects p join membership_scopes s on s.scope_id=p.client_workspace_id and s.scope_type='client_workspace' join t on t.mid=s.membership_id where p.tenant_id=t.tenant_id) select 'R8 used within 30 days', count(*) from memberships m join t on t.mid=m.id where m.last_used_at > now() - interval '30 days';
            ROLLBACK; BEGIN READ ONLY;
            ROLLBACK;
            SQL
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
