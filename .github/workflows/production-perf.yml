name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-STATUS $(date -u +%FT%TZ)"
            echo "## T1. tiktok external campaigns: stored status | raw operation_status | raw secondary_status | count"
            q "select ec.status,coalesce(ec.raw->>'status','-'),coalesce(ec.raw->'raw'->>'operation_status','-'),coalesce(ec.raw->'raw'->>'secondary_status','-'),count(*) from external_campaigns ec where ec.provider='tiktok' group by 1,2,3,4 order by 5 desc;"
            echo "## T2. unified status vs its single external status, by provider: provider | unified | external | adopted_from | count"
            q "with one as (select unified_campaign_id from external_campaigns where unified_campaign_id is not null group by 1 having count(*)=1) select ec.provider,uc.status,ec.status,coalesce(uc.meta->>'adopted_from','-'),count(*) from unified_campaigns uc join external_campaigns ec on ec.unified_campaign_id=uc.id join one on one.unified_campaign_id=uc.id where uc.deleted_at is null group by 1,2,3,4 order by 1,5 desc;"
            echo "## T3. unified campaigns with more than one external: count"
            q "select count(*) from (select unified_campaign_id from external_campaigns where unified_campaign_id is not null group by 1 having count(*)>1) x;"
            echo "== END FACTS-STATUS"
            exit 0
