name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-MAP $(date -u +%FT%TZ)"
            echo "## platform admins and their memberships (counts)"
            q "select count(*) filter (where is_platform_admin), (select count(*) from memberships m join users u on u.id=m.user_id where u.is_platform_admin) from users;"
            echo "## client ip seen by the app: private-range share (no addresses printed)"
            q "select 'contact_messages',count(*),count(*) filter (where ip::text ~ '^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.|127\\.)'),count(distinct ip) from contact_messages union all select 'support_tickets',count(*),count(*) filter (where ip::text ~ '^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.|127\\.)'),count(distinct ip) from support_tickets;"
            q "select 'share_access_logs_30d',count(*),count(*) filter (where ip_address::text ~ '^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.|127\\.)'),count(distinct ip_address) from report_share_access_logs where created_at>now()-interval '30 days';"
            echo "## report_share_access_logs columns"
            q "select string_agg(column_name,',') from information_schema.columns where table_name='report_share_access_logs';"
            echo "## tenants portal config"
            q "select count(*) filter (where portal_enabled),count(*) filter (where is_default_portal),count(*) filter (where portal_domain is not null and portal_domain<>'') from tenants;"
            echo "## external_requests incl. soft-deleted/archived, request tokens, conversions"
            q "select (select count(*) from external_requests),(select count(*) from request_access_tokens),(select count(*) from request_conversions),(select count(*) from client_portal_tokens);"
            echo "## support sessions / audit of platform visits"
            q "select action,count(*) from audit_logs where action like 'platform.support%' or action like 'support%' group by 1 order by 2 desc limit 10;"
            echo "## registration to tenant uniqueness"
            q "select count(*),count(distinct tenant_id) from registration_requests where tenant_id is not null;"
            echo "## subscription payments by status"
            q "select status,count(*) from subscription_payments group by 1;"
            echo "== END FACTS-MAP"
            exit 0
