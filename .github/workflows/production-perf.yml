name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "== FACTS-CR"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL' || echo "psql failed"
            BEGIN READ ONLY; select 'g' q, (c.created_at::date = date '2026-11-08') is_new, count(*) n, sum(case when exists(select 1 from creative_daily_metrics m where m.creative_id=c.id) then 1 else 0 end) with_cdm, sum(case when exists(select 1 from external_ads a where a.creative_id=c.id) then 1 else 0 end) with_ad, sum(case when exists(select 1 from external_ads a where a.external_id=c.external_creative_id and a.creative_id=c.id) then 1 else 0 end) id_eq_adid, sum(case when exists(select 1 from external_ads a where a.external_id=c.external_creative_id) then 1 else 0 end) adid_exists, min(length(c.external_creative_id)) l1, max(length(c.external_creative_id)) l2, sum(case when c.thumbnail_url is null then 1 else 0 end) nothumb from external_creatives c where c.provider='openai_ads' group by 2; ROLLBACK;
            BEGIN READ ONLY; select 'cdm_by_new' q, (c.created_at::date = date '2026-11-08') is_new, count(distinct c.id) creatives, count(*) rows, min(m.metric_date) mn, max(m.metric_date) mx from creative_daily_metrics m join external_creatives c on c.id=m.creative_id where c.provider='openai_ads' group by 2; ROLLBACK;
            BEGIN READ ONLY; select 'cdm_last14' q, (c.created_at::date = date '2026-11-08') is_new, count(distinct c.id) from creative_daily_metrics m join external_creatives c on c.id=m.creative_id where c.provider='openai_ads' and m.metric_date >= current_date-14 group by 2; ROLLBACK;
            BEGIN READ ONLY; select 'new_rows' q, c.external_creative_id, left(md5(c.external_account_id::text),6) acct, left(md5(c.campaign_id::text),6) camp, c.status, c.last_active_at::date la, c.first_seen_at::date fs, (select count(*) from external_ads a where a.creative_id=c.id) ads from external_creatives c where c.provider='openai_ads' and c.created_at::date = date '2026-11-08' order by 2; ROLLBACK;
            BEGIN READ ONLY; select 'ads_new' q, count(*), sum(case when a.created_at::date=date '2026-11-08' then 1 else 0 end) ads_created_today from external_ads a where a.provider='openai_ads'; ROLLBACK;
            BEGIN READ ONLY; select 'orphan_old' q, count(*) from external_creatives c where c.provider='openai_ads' and not exists(select 1 from external_ads a where a.creative_id=c.id); ROLLBACK;
            SQL
            echo "== covers on disk"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend sh -c 'ls /var/www/html/storage/app/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/media/covers -type f 2>/dev/null | wc -l; ls /var/www/html/storage/app/private/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/private/media/covers -type f 2>/dev/null | wc -l' || true
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo "local root=".config("filesystems.disks.local.root").PHP_EOL;' || true
            echo "== END FACTS-CR"
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
