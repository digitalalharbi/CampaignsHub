name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            # STORES-VISIBILITY facts — read-only: states and counts only, never keys or store names.
            echo "== STORES $(date -u +%FT%TZ)"
            for k in SALLA_CLIENT_ID SALLA_CLIENT_SECRET SALLA_WEBHOOK_SECRET ZID_CLIENT_ID ZID_CLIENT_SECRET; do v=$(grep -E "^$k=" deploy/backend.production.env | cut -d= -f2-); [ -n "$v" ] && echo "$k: set" || echo "$k: unset"; done
            $DC exec -T backend php artisan tinker --execute='
              $svc = app(App\Domains\Integrations\Configuration\ProviderConfigurationService::class);
              $reg = app(App\Domains\Commerce\Registry\CommerceConnectorRegistry::class);
              echo "registry: ".implode(",", array_keys($reg->all())).PHP_EOL;
              foreach (["salla","zid"] as $k) {
                $row = DB::table("provider_configurations")->where("provider",$k)->first();
                $st = $svc->state($k);
                echo $k." enabled=".var_export($svc->isEnabled($k),true)." state=".($st->value ?? json_encode($st))." row=".($row? "yes env=".$row->environment : "no")." creds_configured=".var_export(App\Domains\Integrations\OAuth\PlatformCredentials::for($k)->isConfigured(),true)." missing=".implode("|",$svc->missing($k)).PHP_EOL;
                echo "  connections: ".DB::table("provider_connections")->where("provider",$k)->selectRaw("status, count(*) n")->groupBy("status")->get()->map(fn($r)=>$r->status."=".$r->n)->implode(" ").PHP_EOL;
                echo "  stores: ".DB::table("external_accounts")->where("provider",$k)->where("account_type","store")->count().PHP_EOL;
              }
            ' 2>&1 | tail -20
            exit 0
