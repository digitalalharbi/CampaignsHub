name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-XLI2 $(date -u +%FT%TZ)"
            $DC exec -T backend sh -c 'git log -1 --format=%h 2>/dev/null; cat /var/www/html/REVISION 2>/dev/null; date; php -r "echo date_default_timezone_get(),PHP_EOL;"' || true
            $DC exec -T backend php artisan schedule:list 2>/dev/null | grep -E "integrations:sync|creative|covers" || true
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F " | "' <<'SQL'
            BEGIN READ ONLY;
            \echo -- x creatives without a face: project | format | has_card_uri | media_type | has_body | raw_keys | source_updated | last_synced | n
            select project_id, coalesce(format,'NULL'), (raw ? 'card_uri'), coalesce(raw->>'media_type','-'), (coalesce(body,'')<>''), coalesce((select string_agg(k, ',' order by k) from jsonb_object_keys(coalesce(raw,'{}'::jsonb)) k),'-'), max(source_updated_at)::date, max(last_synced_at)::date, count(*) from external_creatives where provider='x' and coalesce(is_demo,false)=false and coalesce(thumbnail_url, asset_url) is null and coalesce(format,'')<>'text_card' group by 1,2,3,4,5,6 order by 1;
            \echo -- x creatives WITH a face, same projects: project | format | has_card_uri | media_type | n
            select project_id, coalesce(format,'NULL'), (raw ? 'card_uri'), coalesce(raw->>'media_type','-'), count(*) from external_creatives where provider='x' and coalesce(is_demo,false)=false and (coalesce(thumbnail_url, asset_url) is not null or format='text_card') group by 1,2,3,4 order by 1;
            \echo -- x accounts per project (bound): project | accounts | distinct connections
            select b.project_id, count(*), count(distinct a.provider_connection_id) from project_integration_bindings b join external_accounts a on a.id=b.external_account_id where b.provider='x' and b.is_active group by 1;
            \echo -- x ads of faceless creatives: project | promoted ads | ad status sample
            select a.project_id, count(*), min(a.status) from external_ads a join external_creatives c on c.id=a.creative_id where c.provider='x' and coalesce(c.thumbnail_url, c.asset_url) is null and coalesce(c.format,'')<>'text_card' group by 1;
            \echo -- x structure sync error lines (last 5 runs with errors): when | left(error,160)
            select created_at, left(coalesce(error,''),160) from metric_sync_runs where provider='x' and error is not null order by created_at desc limit 5;
            ROLLBACK;
            SQL
            echo "== END FACTS-XLI"
            exit 0
