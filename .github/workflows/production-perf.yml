name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "== FACTS-CR"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL' || echo "psql failed"
            BEGIN READ ONLY; select 'runs_cols' q, string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='integration_sync_runs'; ROLLBACK;
            BEGIN READ ONLY; select 'run_media' q, provider, type, status, finished_at, meta->'media', left(coalesce(error,''),200) from integration_sync_runs where meta ? 'media' and provider in ('meta','snapchat') order by finished_at desc nulls last limit 6; ROLLBACK;
            BEGIN READ ONLY; select 'proj_t' q, project_id, count(*) from external_creatives where coalesce(external_account_id,(select external_account_id from external_campaigns c where c.id=external_campaign_id))='383f29e9-7552-480a-8223-1a09dcbcc08f' group by 2; ROLLBACK;
            BEGIN READ ONLY; select 'm_cr' q, project_id, external_account_id is null acc_null, (select external_account_id from external_campaigns c where c.id=external_campaign_id)='1e027047-df04-40cf-872d-485eae82db12' camp_acc, campaign_id is null uc_null, count(*), min(last_active_at), max(last_active_at), max(last_synced_at) from external_creatives where provider='meta' group by 2,3,4,5; ROLLBACK;
            BEGIN READ ONLY; select 'm_cdm' q, count(distinct m.creative_id), min(metric_date), max(metric_date), sum(impressions) from creative_daily_metrics m join external_creatives c on c.id=m.creative_id where c.provider='meta'; ROLLBACK;
            BEGIN READ ONLY; select 'm_cdm_win' q, count(distinct m.creative_id) from creative_daily_metrics m join external_creatives c on c.id=m.creative_id where c.provider='meta' and metric_date between '2026-10-09' and '2026-11-07'; ROLLBACK;
            BEGIN READ ONLY; select 'm_ads' q, count(*), count(creative_id), count(distinct creative_id) from external_ads where provider='meta'; ROLLBACK;
            BEGIN READ ONLY; select 'm_edm_win' q, count(distinct e.entity_id), sum(e.impressions) from entity_daily_metrics e join external_ads a on a.id=e.entity_id where e.entity_type='ad' and a.provider='meta' and e.metric_date between '2026-10-09' and '2026-11-07'; ROLLBACK;
            BEGIN READ ONLY; select 'm_dm_win' q, project_id, external_account_id, sum(impressions) from daily_metrics where external_account_id='1e027047-df04-40cf-872d-485eae82db12' and metric_date between '2026-10-09' and '2026-11-07' group by 2,3; ROLLBACK;
            BEGIN READ ONLY; select 'm_uc_proj' q, uc.project_id, count(*) from external_creatives c join unified_campaigns uc on uc.id=c.campaign_id where c.provider='meta' group by 2; ROLLBACK;
            BEGIN READ ONLY; select 'm_accts' q, id, project_id, provider_connection_id, status from external_accounts where provider='meta'; ROLLBACK;
            BEGIN READ ONLY; select 'cdm_cols' q, string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='creative_daily_metrics'; ROLLBACK;
            SQL
            echo "== covers on disk"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend sh -c 'ls /var/www/html/storage/app/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/media/covers -type f 2>/dev/null | wc -l; ls /var/www/html/storage/app/private/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/private/media/covers -type f 2>/dev/null | wc -l' || true
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo "local root=".config("filesystems.disks.local.root").PHP_EOL;' || true
            echo "== END FACTS-CR"
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
