name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            echo "── host"; uptime; nproc; free -m; df -h / | tail -1
            echo "== FACTS-CR"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL' || echo "psql failed"
            BEGIN READ ONLY; select 'run_media' q, a.provider, r.type, r.status, r.finished_at, r.meta->'media' from integration_sync_runs r join external_accounts a on a.id=r.external_account_id where a.provider in ('meta','snapchat','tiktok') and r.meta ? 'media' order by r.finished_at desc nulls last limit 8; ROLLBACK;
            BEGIN READ ONLY; select 'meta_refs' q, format, k, count(*) from external_creatives, jsonb_object_keys(coalesce(raw->'media_refs','{}'::jsonb)) k where provider='meta' group by 2,3 order by 2,4 desc; ROLLBACK;
            BEGIN READ ONLY; select 'meta_raw' q, format, k, count(*) from external_creatives, jsonb_object_keys(coalesce(raw,'{}'::jsonb)) k where provider='meta' group by 2,3 order by 2,4 desc limit 30; ROLLBACK;
            BEGIN READ ONLY; select 'tt_vid_host' q, raw->>'media' m, substring(thumbnail_url from '^https?://([^/]+)') h, count(*), sum(case when asset_expires_at<now() then 1 else 0 end), min(last_synced_at), max(last_synced_at) from external_creatives where provider='tiktok' and thumbnail_url is not null group by 2,3 order by 4 desc limit 8; ROLLBACK;
            BEGIN READ ONLY; select 'tt_spark_keys' q, raw->>'ad_format' f, k, count(*) from external_creatives, jsonb_object_keys(coalesce(raw,'{}'::jsonb)) k where provider='tiktok' and raw->>'media'='spark' group by 2,3 order by 2,4 desc; ROLLBACK;
            BEGIN READ ONLY; select 'tt_reason_sync' q, raw->>'media_reason' r, date_trunc('day', last_synced_at) d, count(*) from external_creatives where provider='tiktok' and raw ? 'media_reason' group by 2,3 order by 3 desc limit 10; ROLLBACK;
            BEGIN READ ONLY; select 'snap_media_ok' q, format, sum(case when video_url is not null and asset_url is null then 1 else 0 end) vid_only, sum(case when video_url is null and asset_url is null then 1 else 0 end) nothing, sum(case when cards is not null and jsonb_typeof(cards)='array' and jsonb_array_length(cards)>0 then 1 else 0 end) cards_n from external_creatives where provider='snapchat' and is_demo=false group by 2 order by 2; ROLLBACK;
            BEGIN READ ONLY; select 'ext_ads_cols' q, string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_name='external_ads'; ROLLBACK;
            SQL
            echo "== covers on disk"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend sh -c 'ls /var/www/html/storage/app/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/media/covers -type f 2>/dev/null | wc -l; ls /var/www/html/storage/app/private/media/covers 2>/dev/null | wc -l; find /var/www/html/storage/app/private/media/covers -type f 2>/dev/null | wc -l' || true
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo "local root=".config("filesystems.disks.local.root").PHP_EOL;' || true
            echo "== tt thumb probe (status/content-type/bytes only; no URL printed)"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml exec -T backend php <<'PHP' || true
            <?php
            require 'vendor/autoload.php'; $app = require 'bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (['video', 'spark'] as $m) {
              foreach ([true, false] as $fresh) {
                $q = Illuminate\Support\Facades\DB::table('external_creatives')->where('provider', 'tiktok')->whereNotNull('thumbnail_url')->whereNull('cover_path')->whereRaw("raw->>'media' = ?", [$m]);
                $fresh ? $q->where('asset_expires_at', '>', now()) : $q->where('asset_expires_at', '<=', now());
                $u = $q->orderByDesc('last_synced_at')->value('thumbnail_url');
                if (! $u) { echo "$m fresh=".(int)$fresh." none\n"; continue; }
                try { $r = Illuminate\Support\Facades\Http::timeout(15)->get($u); echo "$m fresh=".(int)$fresh." status=".$r->status()." type=".$r->header('Content-Type')." bytes=".strlen($r->body())." host=".parse_url($u, PHP_URL_HOST)."\n"; }
                catch (Throwable $e) { echo "$m fresh=".(int)$fresh." error=".get_class($e)."\n"; }
              }
            }
            PHP
            echo "== END FACTS-CR"
            exit 0
            echo "── containers"; docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} io={{.BlockIO}} pids={{.PIDs}}'
            echo "── top"; top -b -n 1 -o %CPU | sed -n 7,17p
            echo "── app"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:perf-snapshot --hours="${HOURS}"
            echo "── live report build"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T backend php artisan ops:profile-live-report --links=3 --top=20 --explain=3 --http $(for t in $(echo "${TOKENS}" | tr ',' ' '); do printf -- '--token=%s ' "$t"; done) \
              || echo "PROFILER FAILED: see above — other sections are valid"
            echo "── postgres top statements"
            docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL' || echo "pg_stat_statements not available (psql failed): continuing"
            select calls, round(total_exec_time::numeric) as total_ms, round(mean_exec_time::numeric,1) as mean_ms, rows, left(md5(query),8) as finger,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 200) as q
              from pg_stat_statements order by total_exec_time desc limit 20;
            SQL
            if [ -n "${RACCOUNT}" ]; then
              echo "── spend reconcile"
              set +e
              docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml \
                exec -T backend php artisan integrations:spend-reconcile "${RACCOUNT}" ${RFROM:+--from="${RFROM}"} ${RTO:+--to="${RTO}"} \
                || echo "RECONCILE FAILED (provider refused or unreachable): see above — other sections are valid"
              set -e
            fi
