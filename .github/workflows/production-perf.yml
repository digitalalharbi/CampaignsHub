name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-TOKEN-EXPIRY $(date -u +%FT%TZ)"
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off' <<'SQL'
            BEGIN READ ONLY;
            select ar.tenant_id, ar.project_id is not null as project_rule, ar.active, count(*) n from alert_rules ar where ar.type='token_expiry' group by 1,2,3 order by 1;
            select ae.status, ae.rule_id, ae.entity_type, ae.entity_id, ae.context->>'provider' provider, ae.context->>'expires_at' expires_at, (ae.context ? 'error') has_error, ae.created_at, ae.last_triggered_at
              from alert_events ae where ae.type='token_expiry' and ae.last_triggered_at > now() - interval '4 days' order by ae.last_triggered_at desc limit 40;
            select pc.id, pc.provider, pc.status, pc.scope, pc.token_expires_at, pc.last_successful_sync_at, pc.last_health_check_at, (pc.last_error is not null) has_error
              from provider_connections pc where pc.provider in ('google','google_ads') order by pc.updated_at desc limit 10;
            select ic.provider, ic.status, ic.expires_at, ic.last_rotated_at from integration_credentials ic join provider_connections pc on pc.credential_id = ic.id where pc.provider in ('google','google_ads') limit 10;
            ROLLBACK;
            SQL
            echo "== END FACTS-TOKEN-EXPIRY"
            exit 0
