name: Production Performance

# Read-only facts pass: stopped provider connections + Moyasar settlements permission probe.
# SQL runs inside BEGIN READ ONLY ... ROLLBACK. The single Moyasar call is a GET; the key is never printed.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-STOPPED $(date -u +%FT%TZ)"
            echo "== MOYASAR-SETTLEMENTS-PROBE (GET only)"
            $DC exec -T backend sh -c 'cd /var/www/html && php -r '"'"'
            require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $g = app(App\Domains\Billing\Gateways\PaymentGatewaySettings::class);
            $k = $g->value("moyasar","secret_key");
            echo "key_source=", $g->source("moyasar"), " configured=", var_export($g->isConfigured("moyasar"), true), " enabled=", var_export($g->isEnabled("moyasar"), true), " console_mode=", $g->mode("moyasar"), " primary=", $g->primary(), "\n";
            if (!$k) { echo "no_secret_key\n"; exit(0); }
            echo "key_len=", strlen($k), " key_mode=", (strpos($k,"sk_live_")===0?"live":(strpos($k,"sk_test_")===0?"test":"unknown")), "\n";
            $ch = curl_init("https://api.moyasar.com/v1/settlements?page=1");
            curl_setopt_array($ch, [CURLOPT_USERPWD => $k.":", CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 20, CURLOPT_HTTPGET => true]);
            $body = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); $err = curl_error($ch);
            echo "http_status=$code curl_err=", ($err ?: "-"), "\n";
            $j = json_decode((string)$body, true);
            if (is_array($j)) {
              echo "top_level_fields=", implode(",", array_keys($j)), "\n";
              if (isset($j["settlements"]) && is_array($j["settlements"])) { echo "settlements_on_page=", count($j["settlements"]), "\n"; if ($j["settlements"]) echo "settlement_fields=", implode(",", array_keys($j["settlements"][0])), "\n"; }
              if (isset($j["meta"])) echo "meta=", json_encode($j["meta"]), "\n";
              if (isset($j["type"])) echo "error_type=", $j["type"], "\n";
              if (isset($j["message"])) echo "error_message=", substr((string)$j["message"],0,200), "\n";
              if (isset($j["errors"])) echo "errors=", substr(json_encode($j["errors"]),0,200), "\n";
            } else { echo "non_json_body_len=", strlen((string)$body), "\n"; }
            '"'"'' 2>&1
            echo "== END FACTS-STOPPED"
            exit 0
