name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-MEDIA3 $(date -u +%FT%TZ)"
            $DC exec -T backend sh -c 'cat /var/www/html/REVISION 2>/dev/null; date -u' || true
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F " | "' <<'SQL'
            \set ON_ERROR_ROLLBACK on
            \set ON_ERROR_STOP off
            BEGIN READ ONLY;
            \echo -- M7 connections (bound): provider | credential_type | status | scopes | raw_has_scope | n
            select pc.provider, (select ic.credential_type from integration_credentials ic where ic.id=pc.credential_id), pc.status, coalesce(pc.scopes::text,'NULL'), coalesce(pc.raw ? 'scope', false), count(*) from provider_connections pc where pc.id in (select provider_connection_id from external_accounts where id in (select external_account_id from project_integration_bindings where is_active)) group by 1,2,3,4,5 order by 1;
            \echo -- M13 tiktok frame failures: video_host | expires_past | thumb_present | n
            select coalesce(split_part(split_part(video_url,'//',2),'/',1),'NULL'), (asset_expires_at < now()), (thumbnail_url is not null), count(*) from external_creatives where provider='tiktok' and cover_error='frame_ffmpeg_failed' group by 1,2,3 order by 4 desc;
            \echo -- M14 snapchat provider_gave_none images: format | has_media_id | n
            select format, (raw ? 'media_id'), count(*) from external_creatives where provider='snapchat' and cover_error='provider_gave_none' group by 1,2 order by 3 desc;
            ROLLBACK;
            SQL
            echo "== END FACTS-MEDIA"
            exit 0
