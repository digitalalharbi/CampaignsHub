name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            echo "== FACTS-KARAM4 $(date -u +%FT%TZ)"
            $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At' <<'SQL'
            BEGIN READ ONLY;
            \echo -- openai ad set
            select left((select jsonb_object_agg(k,v) from jsonb_each(to_jsonb(s)) e(k,v) where k !~* 'token|secret|raw|targeting|tenant|project|created|updated')::text,500) from external_ad_sets s join external_campaigns c on c.id=s.external_campaign_id where c.external_account_id='ae3333b2-7fc9-4f6b-b2a0-aca4c09ac15b';
            \echo -- openai ads status
            select a.status, a.review_status, count(*) from external_ads a join external_campaigns c on c.id=a.external_campaign_id where c.external_account_id='ae3333b2-7fc9-4f6b-b2a0-aca4c09ac15b' group by 1,2;
            \echo -- openai campaign status raw
            select left(raw::text,900) from external_campaigns where external_account_id='ae3333b2-7fc9-4f6b-b2a0-aca4c09ac15b';
            \echo -- openai structure payload ad_groups body
            select left(payload::text,700) from integration_raw_payloads where external_account_id='ae3333b2-7fc9-4f6b-b2a0-aca4c09ac15b' and resource='structure' order by fetched_at desc limit 4;
            ROLLBACK;
            SQL
            echo "== END FACTS-KARAM4"
            exit 0
