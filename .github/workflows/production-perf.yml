name: Production Performance

# PERF-RECOVERY-001 — asks Production what it is slow at. Manual only. Reads the server's load and
# `ops:perf-snapshot`, which writes nothing, calls no provider and prints no customer value.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of request and query counters to read'
        required: false
        default: '24'
      reconcile_account:
        description: 'Optional: an ad account (ours or the provider''s id) to reconcile — provider spend vs stored spend, read-only'
        required: false
        default: ''
      reconcile_from:
        description: 'Reconcile window start, YYYY-MM-DD'
        required: false
        default: ''
      reconcile_to:
        description: 'Reconcile window end, YYYY-MM-DD'
        required: false
        default: ''
      tokens:
        description: 'Optional: comma-separated link tokens to explain read-only (state + recent access log)'
        required: false
        default: ''

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          HOURS: ${{ inputs.hours }}
          TOKENS: ${{ inputs.tokens }}
          RACCOUNT: ${{ inputs.reconcile_account }}
          RFROM: ${{ inputs.reconcile_from }}
          RTO: ${{ inputs.reconcile_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: HOURS,TOKENS,RACCOUNT,RFROM,RTO
          script: |
            set +e
            cd /opt/campaignshub
            DC="docker compose --env-file deploy/backend.production.env -f deploy/docker-compose.production.yml"
            q() { $DC exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -P pager=off -At -F" | "' 2>&1 <<EOF
            BEGIN READ ONLY;
            $1
            ROLLBACK;
            EOF
            }
            echo "== FACTS-BATCH2 $(date -u +%FT%TZ)"
            echo "## A. 1KCOFFEE unified campaigns: id8 | name | status | objective | source | platform_value | linked provider:objective | deleted"
            q "select left(uc.id::text,8),uc.name,uc.status,uc.objective,uc.objective_source,coalesce(uc.objective_platform_value,'-'),(select string_agg(distinct ec.provider||':'||coalesce(ec.objective,'-'),',') from external_campaigns ec where ec.unified_campaign_id=uc.id),uc.deleted_at is not null from unified_campaigns uc where (uc.name ilike '%1kcoffee%' or uc.name ilike '%1k coffee%' or uc.name ilike '%1k-coffee%' or uc.name ilike '%1k_coffee%');"
            echo "## A2. 1KCOFFEE external campaigns: id8 | provider | provider objective | status | linked"
            q "select left(ec.id::text,8),ec.provider,coalesce(ec.objective,'-'),ec.status,ec.unified_campaign_id is not null from external_campaigns ec where (ec.name ilike '%1kcoffee%' or ec.name ilike '%1k coffee%' or ec.name ilike '%1k-coffee%' or ec.name ilike '%1k_coffee%');"
            echo "## B. 1KCOFFEE last 30d by external campaign: ext id8 | provider | metric_key | sum(value or original) | rows | null-value rows"
            q "select left(dm.external_campaign_id::text,8),dm.provider,dm.metric_key,round(sum(coalesce(dm.value,dm.original_amount))::numeric,2),count(*),count(*) filter (where dm.value is null) from daily_metrics dm join external_campaigns ec on ec.id=dm.external_campaign_id where (ec.name ilike '%1kcoffee%' or ec.name ilike '%1k coffee%' or ec.name ilike '%1k-coffee%' or ec.name ilike '%1k_coffee%') and dm.metric_date>=current_date-30 group by 1,2,3 order by 1,2,3;"
            echo "## C. metric keys present last 30d (non-demo): key | rows"
            q "select metric_key,count(*) from daily_metrics where metric_date>=current_date-30 and coalesce(is_demo,false)=false group by 1 order by 2 desc;"
            echo "## D. CENSUS last 30d, spend>0: provider | platform_value | objective | family | campaigns | conv=0 | conv=0 but objective metric>0 | traffic with LPV>0 | traffic clicks>0"
            q "with m as (select dm.unified_campaign_id id,dm.provider,sum(coalesce(dm.value,dm.original_amount)) filter (where metric_key='spend') spend,sum(dm.value) filter (where metric_key='conversions') conv,sum(dm.value) filter (where metric_key='landing_page_views') lpv,sum(dm.value) filter (where metric_key='clicks') clk,sum(dm.value) filter (where metric_key='impressions') imp,sum(dm.value) filter (where metric_key='engagements') eng,sum(dm.value) filter (where metric_key='video_views') vv,sum(dm.value) filter (where metric_key='leads') lds,sum(dm.value) filter (where metric_key='purchases') pur,sum(dm.value) filter (where metric_key='installs') ins from daily_metrics dm where dm.metric_date>=current_date-30 and dm.unified_campaign_id is not null and coalesce(dm.is_demo,false)=false group by 1,2), c as (select m.*,uc.objective,coalesce(uc.objective_platform_value,'-') pov,case uc.objective when 'awareness' then 'awareness' when 'reach' then 'awareness' when 'traffic' then 'traffic' when 'landing_page_views' then 'traffic' when 'engagement' then 'engagement' when 'video_views' then 'video' when 'leads' then 'leads' when 'sales' then 'sales' when 'conversions' then 'sales' when 'purchases' then 'sales' when 'add_to_cart' then 'sales' when 'app_installs' then 'app' else 'unknown' end fam from m join unified_campaigns uc on uc.id=m.id where uc.deleted_at is null and coalesce(m.spend,0)>0) select provider,pov,objective,fam,count(*),count(*) filter (where coalesce(conv,0)=0),count(*) filter (where coalesce(conv,0)=0 and (case fam when 'traffic' then greatest(coalesce(lpv,0),coalesce(clk,0)) when 'awareness' then coalesce(imp,0) when 'engagement' then coalesce(eng,0) when 'video' then coalesce(vv,0) when 'leads' then coalesce(lds,0) when 'sales' then coalesce(pur,0) when 'app' then coalesce(ins,0) else 0 end)>0),count(*) filter (where fam='traffic' and coalesce(lpv,0)>0),count(*) filter (where fam='traffic' and coalesce(clk,0)>0) from c group by 1,2,3,4 order by 1,5 desc;"
            echo "## E. no_results alert events (all time): status | linked campaign family | count"
            q "select ae.status,case uc.objective when 'awareness' then 'awareness' when 'reach' then 'awareness' when 'traffic' then 'traffic' when 'landing_page_views' then 'traffic' when 'engagement' then 'engagement' when 'video_views' then 'video' when 'leads' then 'leads' when 'sales' then 'sales' when 'conversions' then 'sales' when 'purchases' then 'sales' when 'add_to_cart' then 'sales' when 'app_installs' then 'app' else 'unknown' end,count(*) from alert_events ae left join unified_campaigns uc on uc.id::text=ae.entity_id where ae.type='no_results' group by 1,2 order by 1,2;"
            echo "## F. 1KCOFFEE alert events: type | status | count | last"
            q "select ae.type,ae.status,count(*),max(ae.last_triggered_at)::date from alert_events ae join unified_campaigns uc on uc.id::text=ae.entity_id where (uc.name ilike '%1kcoffee%' or uc.name ilike '%1k coffee%' or uc.name ilike '%1k-coffee%' or uc.name ilike '%1k_coffee%') group by 1,2 order by 1,2;"
            echo "== END FACTS-BATCH2"
            exit 0
