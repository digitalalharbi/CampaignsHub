name: Backend full suite (nightly, sharded)

# CI-SPEED-002 — what a pull request's path-filtered `backend` check no longer runs on every change, kept exercised on main.
#
# A pull request now runs the full sharded backend suite only when backend/ (or anything outside frontend/ and docs/)
# changed, and a small guard job otherwise (ci.yml, `changes`). This runs the WHOLE suite against `main` once a day,
# at night (21:37 UTC = 00:37 Riyadh — a quiet hour for the 20-seat runner pool; off the :00/:30 marks, where GitHub delays
# scheduled runs), dealt into eight shards by `.github/scripts/backend-shard.py` with the same proof the PR check
# uses (every test exactly once, none failed). It was one process of ~60-70 minutes (measured 55-72 min, 2026-11-13..18),
# started at 07:39-09:17 UTC because GitHub delayed the 01:17 cron; now it is eight ~7-minute jobs.
#
# What is traded: the shards are separate processes, so «a test that only fails after another file's leftovers» (the
# reason the one-process run existed) is not exercised by the nightly run any more. It still can be, on demand: dispatch
# with `single_process: true` runs the old job unchanged. That is the only trigger for it — no cron.
#
# It does not block pull requests. A red run here is a finding about `main`, read from the Actions tab.

on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
    inputs:
      single_process:
        description: 'Run the whole suite as ONE process (the old nightly job, ~1 hour) instead of eight shards'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-full-suite
  cancel-in-progress: false

jobs:
  shards:
    name: backend (tests ${{ matrix.shard }}/8)
    if: ${{ !inputs.single_process }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Written four times — here, in the job name, and as the `8` in the plan/verdict calls. Keep equal to ci.yml.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Python dependency for the PDF text-layer contract
        run: python3 -m pip install --quiet pikepdf
      - name: Plan shard ${{ matrix.shard }}/8
        run: python3 ../.github/scripts/backend-shard.py plan ${{ matrix.shard }} 8 "$RUNNER_TEMP/backend-evidence"
      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: mediabuying_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
        run: php artisan test --log-junit="$RUNNER_TEMP/backend-evidence/junit.xml"
      - name: Shard evidence for the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/backend-evidence/
          if-no-files-found: ignore
          retention-days: 3

  verdict:
    name: backend full suite (verdict)
    if: ${{ always() && !inputs.single_process }}
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard succeeded
        run: |
          echo "shards: ${{ needs.shards.result }}"
          [ "${{ needs.shards.result }}" = success ] \
            || { echo "::error::a shard did not succeed (failure, cancelled and skipped are all red)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: ${{ runner.temp }}/backend-evidence
      - name: The shards ran the whole suite, exactly once
        run: python3 .github/scripts/backend-shard.py verdict 8 "$RUNNER_TEMP/backend-evidence"

  full-suite:
    name: backend full suite (one process)
    if: ${{ inputs.single_process }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Python dependency for the PDF text-layer contract
        run: python3 -m pip install --quiet pikepdf
      - name: Tests — the whole suite, one process
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: mediabuying_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
        run: php artisan test
