name: Production Diagnostics

# INTEG-RUNTIME §7 — the only way to ask production a question, and it can only ask questions.
#
# `integrations:diagnose` calls no provider, refreshes no token, queues no job and writes no row: it
# reads the run log and the retained provider payloads and prints where the rows stopped. This
# workflow exists because that answer lives on the VPS and nowhere else, and «why is the number 0?»
# cannot be settled from a laptop.
#
# Manual only. There is no push trigger and no schedule, so it runs when a human asks and not
# otherwise. The command is fixed here — the inputs are filters passed as arguments, never a command.

on:
  workflow_dispatch:
    inputs:
      provider:
        # The keys the DATA uses, from `ProviderDisplayName::NAMES`. This list said `google_ads`,
        # which matches no row: a diagnosis run with it answers «No external account matches that
        # filter» — indistinguishable from «this provider has no accounts», which is exactly the
        # wrong conclusion to hand someone asking why a provider is quiet.
        description: 'Provider key to diagnose (snapchat, tiktok, meta, google, x, linkedin, salla, zid)'
        required: false
        default: 'snapchat'
      account:
        description: 'Optional: one account id — ours or the provider''s own'
        required: false
        default: ''
      runs:
        description: 'Recent runs to show per account'
        required: false
        default: '5'
      accounts:
        description: 'Accounts to show'
        required: false
        default: '10'
      linked:
        description: 'Only accounts with an ACTIVE binding to a project'
        type: boolean
        required: false
        default: false
      payload:
        description: 'Print the provider''s own last insights body'
        type: boolean
        required: false
        default: false
      downstream:
        description: 'What the assigned project now holds — the tables every surface reads'
        type: boolean
        required: false
        default: false
      hierarchy:
        description: 'Campaigns → ad squads → ads → creatives, with the orphans at each level'
        type: boolean
        required: false
        default: false
      probe_account:
        description: 'Optional: ask the provider directly for this account (id, ours or theirs). Stores nothing.'
        required: false
        default: ''
      probe_from:
        description: 'Probe window start, YYYY-MM-DD'
        required: false
        default: ''
      probe_to:
        description: 'Probe window end, YYYY-MM-DD'
        required: false
        default: ''
      probe_media:
        description: 'FETCH the first-page assets for probe_account and report status, content type and decoded size. Proves an image actually loads, not that a URL exists.'
        type: boolean
        required: false
        default: false
      probe_shapes:
        description: 'With probe_structure: also ask the ads edge and report the KEY NAMES each creative body carries, by type. Never values — this is how a provider''s real shape is read before writing a fetch against it.'
        type: boolean
        required: false
        default: false
      probe_structure:
        description: 'Ask for the CAMPAIGN STRUCTURE instead of insights — identity, counts, statuses and date range. Use this to choose which ad account to bind.'
        type: boolean
        required: false
        default: false
      content_creative:
        description: 'Owner defect 95 — walk ONE creative from the provider rows to every Content surface (id, ours or the provider''s own). Read-only.'
        required: false
        default: ''
      content_scope:
        description: 'Owner defect 95 — reconcile a whole project''s LIBRARY: what the headline strip states against what the cards state, and the gap in money.'
        type: boolean
        required: false
        default: false
      content_project:
        description: 'Optional: the project for content_scope. Omitted: the one holding the most creatives.'
        required: false
        default: ''
      content_from:
        description: 'Optional window start for the Content walk (YYYY-MM-DD). Default: 29 days before content_to.'
        required: false
        default: ''
      content_to:
        description: 'Optional window end for the Content walk (YYYY-MM-DD). Default: today.'
        required: false
        default: ''
      content_census:
        description: 'Content Production Recovery — LIST the creatives with no preview, spend without indicators, indicators without spend, or a missing objective metric, and the rung each breaks at. Uses content_project/from/to. Read-only; prints ids, never names or urls.'
        type: boolean
        required: false
        default: false
      content_fetch:
        description: 'With content_census: also LOAD each promoted creative''s preview asset on the server (image decodes, video streams) and list the ones that do not load, by id. Fetches the CDN asset only; stores nothing; prints no url.'
        type: boolean
        required: false
        default: false
      quarantine_sandbox:
        description: 'Report the sandbox rows sitting in LIVE accounts. Reports only; never deletes from this workflow.'
        type: boolean
        required: false
        default: false

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Diagnose on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROVIDER: ${{ inputs.provider }}
          ACCOUNT: ${{ inputs.account }}
          RUNS: ${{ inputs.runs }}
          ACCOUNTS: ${{ inputs.accounts }}
          LINKED: ${{ inputs.linked && '--linked' || '' }}
          PAYLOAD: ${{ inputs.payload && '--payload' || '' }}
          DOWNSTREAM: ${{ inputs.downstream && '--downstream' || '' }}
          HIERARCHY: ${{ inputs.hierarchy && '--hierarchy' || '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PROVIDER,ACCOUNT,RUNS,ACCOUNTS,LINKED,PAYLOAD,DOWNSTREAM,HIERARCHY
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            # Production runs in containers — there is no `php` on the host's PATH, which is what the
            # first attempt at this workflow discovered (`bash: line 8: php: command not found`). The
            # command goes where the application actually lives, exactly as `deploy-production.sh`
            # runs `artisan migrate`.
            #
            # Quoted, and passed as VALUES to a fixed command. Nothing here builds a command from input.
            docker compose \
              --env-file deploy/backend.production.env \
              -f deploy/docker-compose.production.yml \
              exec -T backend php artisan integrations:diagnose \
                --provider="${PROVIDER}" \
                --account="${ACCOUNT}" \
                --runs="${RUNS}" \
                --accounts="${ACCOUNTS}" \
                ${LINKED} ${PAYLOAD} ${DOWNSTREAM} ${HIERARCHY}

  # ── The probe ────────────────────────────────────────────────────────────────────────────────────
  #
  # `integrations:probe` DOES call the platform — that is its whole purpose — and stores nothing: no
  # run row, no metric, no retained payload, no checkpoint. It exists because «the provider returned
  # 0 rows» has two readings, and only asking over a different window separates them.
  #
  # It runs only when `probe_account` is given, so the default dispatch stays a pure read of what is
  # already recorded.
  probe:
    if: inputs.probe_account != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe the provider
        uses: appleboy/ssh-action@v1.2.2
        env:
          ACCOUNT: ${{ inputs.probe_account }}
          FROM: ${{ inputs.probe_from }}
          TO: ${{ inputs.probe_to }}
          STRUCTURE: ${{ inputs.probe_structure && '--structure' || '' }}
          SHAPES: ${{ inputs.probe_shapes && '--shapes' || '' }}
          MEDIA: ${{ inputs.probe_media && '--media' || '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ACCOUNT,FROM,TO,STRUCTURE,MEDIA,SHAPES
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            # `--structure` asks the campaigns edge instead of insights: «does this ad account hold
            # the business's campaigns» cannot be answered from a spend window, because an account
            # silent for thirty days looks exactly like an empty one through one. Still stores
            # nothing — the campaigns come back, are counted, and are thrown away.
            #
            # The comment sits ABOVE the command and not inside it: a `#` line between two
            # backslash-continued lines ENDS the continuation, and bash then ran `exec -T backend …`
            # as a statement of its own — «bash: line 14: exec: -T: invalid option», which reads like
            # a docker problem and was a comment in the wrong place.
            docker compose \
              --env-file deploy/backend.production.env \
              -f deploy/docker-compose.production.yml \
              exec -T backend php artisan integrations:probe \
                "${ACCOUNT}" --from="${FROM}" --to="${TO}" --rows="12" ${STRUCTURE} ${MEDIA} ${SHAPES}

  # ── The sandbox quarantine, in its REPORTING form only ───────────────────────────────────────────
  #
  # `integrations:quarantine-sandbox` can delete, and this workflow deliberately cannot pass
  # `--apply`. Removing rows from a production database is not something a dispatch button should be
  # able to do by having a box ticked: the report is what a person reads before deciding, and the
  # decision is made by somebody with a shell.
  #
  # SANDBOX-PROD-001 §3 — «document exact row counts before/after», which is what a dry run is for.
  quarantine:
    if: inputs.quarantine_sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report sandbox rows in live accounts
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROVIDER: ${{ inputs.provider }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PROVIDER
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            docker compose \
              --env-file deploy/backend.production.env \
              -f deploy/docker-compose.production.yml \
              exec -T backend php artisan integrations:quarantine-sandbox --provider="${PROVIDER}"

  # ── The Content truth chain ──────────────────────────────────────────────────────────────────────
  #
  # Owner defect 95: «Content metrics are fundamentally inconsistent in Production — sometimes the
  # KPIs appear but Spend is missing, sometimes Spend appears and the other KPIs disappear», and the
  # register records under root cause that the chain «has never been reconciled end to end on one
  # creative».
  #
  # It cannot be reconciled from a laptop, and that is not a preference. The defect lives on a
  # connected ad account; every credential on a development install is a seeded placeholder; and the
  # seeded library cannot even produce the shape — there is no creative in it whose figures exist only
  # at the ad grain, which is what five of six providers produce. So the walk has to run where the
  # rows are, and this is the only way to ask production a question.
  #
  # `content:reconcile` calls the product's OWN services at every rung — `CreativeRows::present()` as
  # `CreativeAnalysisController` calls it, `lean()` as `ReportAds` calls it, `CreativeMetrics::
  # forCreatives` and `::totalsFor` as the controller calls them, `CreativePresenter::preview()` as
  # every surface does — so it cannot report a divergence the running product does not have. An
  # instrument that reaches around a step of the real pipeline invents defects that are its own, and
  # this repository has paid for that twice.
  #
  # It writes nothing, queues nothing and calls no provider, which is what makes it safe to point at a
  # live account while a customer is looking at the same screen. And it prints no url, no token and no
  # signed asset link — the preview rung reports the STATE and whether each url exists. A workflow log
  # is readable by anybody with repository access, which is not the same audience as the ad account.
  #
  # Runs only when asked, so the default dispatch stays a pure read of what is already recorded.
  content:
    if: inputs.content_creative != '' || inputs.content_scope
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reconcile the Content chain on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          CREATIVE: ${{ inputs.content_creative }}
          SCOPE: ${{ inputs.content_scope && '--scope' || '' }}
          PROJECT: ${{ inputs.content_project }}
          FROM: ${{ inputs.content_from }}
          TO: ${{ inputs.content_to }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: CREATIVE,SCOPE,PROJECT,FROM,TO
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            # Quoted, and passed as VALUES to a fixed command. Nothing here builds a command from
            # input — the same rule the diagnose job states, for the same reason.
            #
            # The empty options are deliberate rather than conditional: the command's own defaults are
            # «the busiest creative» and «the last thirty days», which is what a reader who names
            # neither actually wants, and a shell that assembles flags conditionally is a shell that
            # eventually assembles a command.
            docker compose \
              --env-file deploy/backend.production.env \
              -f deploy/docker-compose.production.yml \
              exec -T backend php artisan content:reconcile \
                "${CREATIVE}" --project="${PROJECT}" --from="${FROM}" --to="${TO}" ${SCOPE}

  # ── The Content defect census ────────────────────────────────────────────────────────────────────
  #
  # The walk above answers «which rung does ONE creative fall off». The Owner's Production observation
  # is about a SET: some items with no preview, some with Spend and no indicators, some with
  # indicators and no Spend. Which creatives those are cannot be guessed from a laptop, so
  # `content:census` lists them — every creative in every project that holds one (or the one project
  # named), through the same services the library calls, filed by what a reader sees and the rung it
  # breaks at.
  #
  # Same bar as the walk: writes nothing (every-column digest in `ContentDefectCensusTest`), calls no
  # provider, and prints the internal creative id, provider, format, kind and objective — never a
  # name, an account, a url or a signed link.
  census:
    if: inputs.content_census
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: List the broken creatives on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROJECT: ${{ inputs.content_project }}
          FROM: ${{ inputs.content_from }}
          TO: ${{ inputs.content_to }}
          FETCH: ${{ inputs.content_fetch && '--fetch' || '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 12m
          envs: PROJECT,FROM,TO,FETCH
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            # Passed as VALUES to a fixed command; empty options fall back to the command's defaults
            # (every project, the last thirty days) — see the note on the content job above.
            docker compose \
              --env-file deploy/backend.production.env \
              -f deploy/docker-compose.production.yml \
              exec -T backend php artisan content:census \
                --project="${PROJECT}" --from="${FROM}" --to="${TO}" --list="200" ${FETCH}
