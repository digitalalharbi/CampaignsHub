# Claude Code — mention @claude in an issue or a pull request and it opens a branch and a PR.
#
# Deliberately SEPARATE from ci.yml. That workflow is the gate every change must pass; this one is a
# contributor. Merging them would mean an agent's failure looked like a broken build, and a broken
# build looked like an agent's failure.
#
# What it may do: read this repository, work on a branch, open a pull request.
# What it may NOT do: push to `main` — the ruleset forbids it and nothing here tries.
#
# It receives exactly one secret, ANTHROPIC_API_KEY, from GitHub Actions secrets. No provider
# credential, no deployment credential, no ability to write a secret. See
# docs/CHANGE_MANAGEMENT.md §6.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# One conversation at a time per issue or PR. Two Claude runs on the same thread would race each
# other's branch.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only on an explicit @claude mention, and never from a fork — a workflow triggered by an
    # outside pull request must not be handed a secret. GitHub withholds them by default; this
    # states the intent rather than relying on the default staying put.
    if: >-
      github.event.repository.fork == false &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )

    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Least privilege: enough to read the code, push a branch and open a PR. Nothing that could
    # deploy, release, or reach the repository's settings.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history: a root-cause question is usually answered by `git log`, and a shallow
          # clone cannot answer it.
          fetch-depth: 0

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE.md is read automatically and carries the standing rules: origin/main is the
          # source of truth, branch as claude/<issue>-<slug>, never push to main, never claim
          # LIVE_VERIFIED, never redo VERIFIED work without proving a defect first.
          claude_args: |
            --allowedTools "Bash(composer:*),Bash(php:*),Bash(npm:*),Bash(git:*),Read,Edit,Write,Glob,Grep"
