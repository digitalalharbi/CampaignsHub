name: Claude (DISABLED — owner cancelled paid execution)

# PAID CLAUDE EXECUTION THROUGH GITHUB IS CANCELLED BY OWNER — 2026-08-20.
#
# This workflow used to answer an `@claude` mention on an issue or a review comment by running
# `anthropics/claude-code-action` with `ANTHROPIC_API_KEY`. Every one of those paths is removed:
# the four event triggers that could fire it, the action itself, and the secret it consumed.
#
# What remains is a manually dispatched no-op that states the position. The file is kept rather than
# deleted so the cancellation is visible in the tree — a silent absence is what somebody re-adds by
# accident six months from now, and there is nothing here to re-enable by mistake.
#
# ALL PRODUCT DEVELOPMENT EXECUTION HAPPENS DIRECTLY FROM THE CLAUDE CODE CONTAINER.
# GitHub is source control, CI and deployment only. It must never invoke Claude or Anthropic for
# development. `scripts/autopilot/test-autopilot.sh` fails the build if that changes.

on:
  workflow_dispatch:

permissions: {}

jobs:
  cancelled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: State the cancellation
        run: |
          echo "::notice::Paid Claude execution through GitHub is CANCELLED BY OWNER (2026-08-20)."
          echo "::notice::Development runs from the Claude Code container. @claude does nothing here."
