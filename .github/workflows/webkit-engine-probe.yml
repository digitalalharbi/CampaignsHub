name: WebKit engine probe

# Investigation, not a gate (Owner 2026-10-22): the recurring «WebKit encountered an internal error» on the advertiser rail walk
# (#795 twice, #822 — always portal-audit.spec.ts:75, test 726 of 986, ~40 minutes into the run, on /app/subscriptions, the
# ~20th full page load inside ONE page). This runs that walk repeatedly in ONE browser process with per-navigation process
# memory, so the failure is measured instead of re-run: if it reproduces, at which walk and link, and with what memory.
# It starts on a push to its own branch and by hand; it touches no pull request and no gate.

on:
  push:
    branches: ['probe/webkit-engine']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    name: probe (webkit)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediabuying_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Backend environment
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate
      # The gate's own servers read these; `e2e/env.ts` overrides the rest per run.
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      # Pure download, no application code. It takes ~2 minutes when GitHub's mirror is healthy; the
      # bound is here so a stall on their side fails in fifteen minutes and says which step did it,
      # instead of holding a runner until the job timeout and reporting nothing at all.
      # The matrix browser AND chromium.
      #
      # Every project in `playwright.config.ts` declares `dependencies: ['setup']`, and the `setup`
      # project carries no `use` — so it runs under Playwright's default, chromium. The firefox job
      # therefore launches chromium before it launches firefox, and installing only firefox failed
      # six tests with «Executable doesn't exist at …/chromium_headless_shell». Playwright dedupes
      # the repeat when the matrix browser IS chromium.
      #
      # CACHED, and the timeout raised — the webkit leg has lost this step three times.
      #
      # «~2 minutes when GitHub's mirror is healthy» was true and is not the whole distribution.
      # Three runs in this programme died here, each one at exactly fifteen minutes, with the apt
      # half (`--with-deps`) still fetching mesa and gstreamer packages — a job that ran no test and
      # reported «gate failed», which reads as a product defect and is a download.
      #
      # The cache removes the browser payload on a hit (the apt packages are not cached: they are
      # installed into the runner image, not into a directory). The key carries the Playwright
      # version, so an upgrade misses deliberately rather than restoring browsers that no longer
      # match. Twenty-five minutes is the bound for a cold miss — still a bound, so a genuine stall
      # fails and names this step rather than holding the runner.
      - name: Restore apt archives
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-webkit-${{ github.run_id }}
          restore-keys: |
            apt-debs-${{ runner.os }}-webkit-
      - name: Browsers
        working-directory: frontend
        run: bash ../.github/scripts/install-browsers.sh webkit
      - name: Arabic text-layer toolchain
        run: python3 -m pip install --quiet pikepdf
      - name: The advertiser rail walk, repeated in one browser process
        working-directory: frontend
        continue-on-error: true
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
          E2E_SKIP_RESET: '0'
          DEBUG: 'pw:browser'
        run: |
          npx playwright test e2e/engine-probe.spec.ts --project=webkit --repeat-each=${{ vars.PROBE_REPEAT || 14 }} --output=test-results/webkit 2>&1 | tee /tmp/engine-probe.log
          exit "${PIPESTATUS[0]}"
      - name: What it measured
        if: always()
        run: |
          echo "== navigations"; grep -c ' link=' /tmp/engine-probe.log || true
          echo "== blank pages"; grep ' BLANK ' /tmp/engine-probe.log | cut -c1-400 || true
          echo "== engine errors"; grep -c 'WebKit encountered an internal error' /tmp/engine-probe.log || true
          echo "== memory, first and last navigation"; grep ' link=' /tmp/engine-probe.log | sed -n '1p;$p' | cut -c1-300
          echo "== browser stderr (crash / OOM / network process)"; grep -i -E 'crash|terminated|killed|oom|out of memory|network process|webprocess' /tmp/engine-probe.log | head -20 | cut -c1-300 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-probe-log
          path: /tmp/engine-probe.log
