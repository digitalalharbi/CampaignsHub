name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# CI-SPEED-002 — a RUNNING deploy is never cancelled (`cancel-in-progress: false`): the newer one waits for it.
#
# What GitHub does with the waiting ones: a concurrency group holds at most ONE pending run. When a third push arrives
# while one deploy runs and one waits, the waiting one is replaced and finishes as `cancelled` without a single job
# starting (measured 2026-11-18: db8db94e, 04dab5f4, ee3a0d27, cf99ccce, 0e079727 were all replaced this way, each
# between 20 seconds and 39 minutes after being queued, by a later push). That is safe for what ships — every deploy builds the
# commit it was triggered by and the latest pending one always runs, so main is what ends up live — but a
# `cancelled` conclusion on a merge's own run is NOT a failure and NOT proof. Prove a merge with the newest
# SUCCESSFUL deploy whose commit is that merge or a descendant of it (docs/ci/CI-SPEED-2026-11-19.md, «Deploy proof»).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # PERF-BUILD-OFF-VPS-001 — build here, on GitHub's runner, never on the 1-CPU production host.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.production.Dockerfile
          push: true
          tags: |
            ghcr.io/digitalalharbi/campaignshub-backend:${{ github.sha }}
            ghcr.io/digitalalharbi/campaignshub-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.production.Dockerfile
          push: true
          # Same values as the compose file's build args; keep the two in step.
          build-args: |
            VITE_API_URL=https://api.campaignshub.io/api/v1
            VITE_BRAND_NAME=CampaignsHub
            VITE_BRAND_DOMAIN=campaignshub.io
            VITE_INFLUENCERS_UGC=false
          tags: |
            ghcr.io/digitalalharbi/campaignshub-frontend:${{ github.sha }}
            ghcr.io/digitalalharbi/campaignshub-frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          CH_BACKEND_IMAGE: ghcr.io/digitalalharbi/campaignshub-backend:${{ github.sha }}
          CH_FRONTEND_IMAGE: ghcr.io/digitalalharbi/campaignshub-frontend:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          # Short-lived job token, read-only on packages; the script logs out when it finishes.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: CH_BACKEND_IMAGE,CH_FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # DEPLOY-TIMEOUT-001 — the ceiling that was actually stopping the deploy.
          #
          # `timeout-minutes: 30` above is the JOB's budget and this action never reached it:
          # `appleboy/ssh-action` applies its OWN `command_timeout`, which defaults to 10m. A VPS
          # build that compiles the frontend and exports a Docker image runs longer than that, so the
          # script was killed mid-unpack with «Run Command Timeout» at 602597ms — after the image had
          # been built, and before anything was restarted. The workflow then reported failure for a
          # build that had worked, and main sat merged-but-not-deployed until somebody re-ran it.
          #
          # 25m rather than 30m: it must expire INSIDE the job's budget, or the job is killed first
          # and the log ends with no reason in it at all.
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            export CH_BACKEND_IMAGE CH_FRONTEND_IMAGE GHCR_USER GHCR_TOKEN
            bash scripts/deploy-production.sh

      # DEPLOY-VERIFY-001 — the deploy says what production now SERVES, or it is not a verification.
      #
      # «merge ≠ deploy» has cost this project real time twice: a deploy whose SSH connection timed
      # out reported failure for a build that had worked, and a deploy that reported success left the
      # previous bundle in front of users because nothing checked. Both were found by hand, by
      # fetching the site and reading the asset hash out of the HTML — and the host lives in a
      # secret, so «which bundle is live?» was a question only somebody who already knew the URL
      # could ask.
      #
      # So the run log answers it. The hash is the whole point: it changes when, and only when, the
      # frontend was rebuilt from a different tree, which is the one thing a green SSH step cannot
      # tell you. The domain is not a secret — it is a build argument in the compose file.
      - name: Verify what production serves
        run: |
          set -Eeuo pipefail
          SITE="https://campaignshub.io"
          API="https://api.campaignshub.io/api/v1/health"

          # The container restarts behind the proxy; a single immediate probe races it.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE/" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $attempt — site answered $code, waiting"
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::$SITE/ answered $code after the deploy"; exit 1; }

          html=$(curl -s --max-time 20 "$SITE/")
          bundle=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$bundle" ] || { echo "::error::no hashed entry bundle in the served HTML"; exit 1; }

          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$API" || echo 000)
          [ "$api" = "200" ] || { echo "::error::$API answered $api"; exit 1; }

          {
            echo "### Production now serves"
            echo ""
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| commit | \`${GITHUB_SHA:0:8}\` |"
            echo "| entry bundle | \`$bundle\` |"
            echo "| site | $code |"
            echo "| api health | $api |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "served bundle: $bundle (commit ${GITHUB_SHA:0:8})"
