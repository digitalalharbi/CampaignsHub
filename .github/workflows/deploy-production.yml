name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # DEPLOY-TIMEOUT-001 — the ceiling that was actually stopping the deploy.
          #
          # `timeout-minutes: 30` above is the JOB's budget and this action never reached it:
          # `appleboy/ssh-action` applies its OWN `command_timeout`, which defaults to 10m. A VPS
          # build that compiles the frontend and exports a Docker image runs longer than that, so the
          # script was killed mid-unpack with «Run Command Timeout» at 602597ms — after the image had
          # been built, and before anything was restarted. The workflow then reported failure for a
          # build that had worked, and main sat merged-but-not-deployed until somebody re-ran it.
          #
          # 25m rather than 30m: it must expire INSIDE the job's budget, or the job is killed first
          # and the log ends with no reason in it at all.
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            cd /opt/campaignshub
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash scripts/deploy-production.sh
